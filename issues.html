 limit", "he": "הגבלה לשתי כהונות", "ru": "Не более двух сроков"}, {"id": "years", "en": "Eight-year cumulative limit", "he": "הגבלה לשמונה שנים מצטברות", "ru": "Не более восьми лет суммарно"}, {"id": "recall", "en": "Public recall mechanism", "he": "מנגנון הדחה ביוזמת הציבור", "ru": "Отзыв по инициативе граждан"}, {"id": "elections", "en": "Elections and parliamentary confidence", "he": "בחירות ואמון הכנסת", "ru": "Выборы и доверие парламента"}], "ru": "Механизм подотчётности", "similarity": {"matrix": {"terms": {"terms": 1, "years": 0.75, "recall": 0.25, "elections": 0}, "years": {"terms": 0.75, "years": 1, "recall": 0.25, "elections": 0}, "recall": {"terms": 0.25, "years": 0.25, "recall": 1, "elections": 0.5}, "elections": {"terms": 0, "years": 0, "recall": 0.5, "elections": 1}}, "rationale": {"en": "Term and year caps both impose mandatory turnover but differ with early elections; recall shares voter control with ordinary elections.", "he": "מגבלת כהונות ושנים מחייבות תחלופה אך שונות במצב של בחירות מוקדמות; הדחה ביוזמת הציבור חולקת שליטה של הבוחר עם בחירות.", "ru": "Лимиты сроков и лет требуют сменяемости, но различаются при досрочных выборах; отзыв и выборы разделяют контроль избирателей."}}}], "options": [{"id": "two_terms", "en": "Limit the prime minister to two terms, even if voters would otherwise elect them again.", "he": "להגביל את ראש הממשלה לשתי כהונות, גם אם הבוחרים היו מעוניינים לבחור בו שוב.", "profile": {"binding_limit": "yes", "mechanism": "terms"}, "ru": "Ограничить премьер-министра двумя сроками, даже если избиратели хотели бы выбрать его снова."}, {"id": "eight_years", "en": "Set an eight-year cumulative limit, regardless of how many governments or elections occur.", "he": "לקבוע הגבלה מצטברת של שמונה שנים, בלי קשר למספר הממשלות או מערכות הבחירות.", "profile": {"binding_limit": "yes", "mechanism": "years"}, "ru": "Установить совокупный предел в восемь лет независимо от числа правительств и выборов."}, {"id": "recall", "en": "Allow unlimited terms but add a public recall procedure between elections.", "he": "לאפשר כהונות ללא הגבלה, אך להוסיף הליך הדחה ביוזמת הציבור בין בחירות.", "profile": {"binding_limit": "no", "mechanism": "recall"}, "ru": "Не ограничивать число сроков, но ввести процедуру отзыва по инициативе граждан между выборами."}, {"id": "elections", "en": "Keep tenure unlimited and leave replacement to elections and parliamentary confidence.", "he": "להשאיר את משך הכהונה ללא הגבלה ולהותיר את ההחלפה לבחירות ולאמון הכנסת.", "profile": {"binding_limit": "no", "mechanism": "elections"}, "ru": "Не ограничивать срок пребывания у власти, оставив смену премьер-министра выборам и доверию Кнессета."}], "note": "Choose the policy package closest to your view. Each package has two separately scored components; choosing a package does not establish views beyond its wording.", "note_he": "בחרו את חבילת המדיניות הקרובה ביותר לעמדתכם. בכל חלופה שני מרכיבים שמושווים בנפרד; הבחירה אינה מעידה על עמדות מעבר למה שנכתב.", "ru": "Как ограничивать пребывание премьер-министра у власти и обеспечивать его подотчётность?", "note_ru": "Выберите пакет политики, наиболее близкий к вашей позиции. Его два компонента сравниваются отдельно; выбор не означает согласия с положениями, которые здесь не указаны.", "help": {"overview": {"en": "Tenure limits encourage turnover but restrict voters' ability to retain a leader. Two terms and eight years are not equivalent when elections occur early. Recall procedures instead let voters initiate removal without a fixed tenure cap.", "he": "הגבלת כהונה מעודדת תחלופה אך מגבילה את יכולת הבוחרים להשאיר מנהיג בתפקיד. שתי כהונות ושמונה שנים אינן זהות כשבחירות מוקדמות. הליך הדחה ציבורי מאפשר לבוחרים ליזום החלפה בלי תקרת כהונה קבועה.", "ru": "Лимиты обеспечивают сменяемость, но ограничивают возможность сохранить лидера. Два срока не равны восьми годам при досрочных выборах. Отзыв позволяет гражданам инициировать отстранение без фиксированного предела пребывания у власти."}, "links": [{"url": "https://en.idi.org.il/articles/64011", "title": {"en": "IDI: The debate over prime-minister term limits", "he": "IDI: הדיון על הגבלת כהונת ראש ממשלה", "ru": "IDI: спор об ограничении сроков премьер-министра"}, "kind": "analysis", "language": "en"}, {"url": "https://beytenu.org.il/party-platform/", "title": {"en": "Yisrael Beytenu: party platform", "he": "ישראל ביתנו: מצע המפלגה", "ru": "Наш дом Израиль: программа партии"}, "kind": "party", "language": "he"}], "discussion": {"en": ["Should a short caretaker government count as a full term, and should nonconsecutive years be added together?", "How can a recall mechanism enable accountability without becoming a permanent election campaign?"], "he": ["האם ממשלת מעבר קצרה תיספר ככהונה מלאה, והאם שנים לא רצופות יצטברו?", "כיצד מנגנון הדחה יאפשר אחריות בלי להפוך לקמפיין בחירות מתמשך?"], "ru": ["Считать ли короткую переходную администрацию полным сроком и суммировать ли непоследовательные годы?", "Как отзыв обеспечит подотчётность, не превращаясь в непрерывную избирательную кампанию?"]}}}, {"id": "Q15", "short": false, "domain": "religion", "en": "How should the law recognize same-sex families?", "he": "כיצד צריך החוק להכיר במשפחות של זוגות מאותו מין?", "dimensions": [{"id": "parent_status", "en": "Equal legal parental status", "he": "מעמד הורי משפטי שווה", "weight": 1, "values": [{"id": "yes", "en": "Yes", "he": "כן", "ru": "Да"}, {"id": "no", "en": "No", "he": "לא", "ru": "Нет"}], "ru": "Равный юридический родительский статус", "similarity": {"matrix": {"yes": {"yes": 1, "no": 0}, "no": {"yes": 0, "no": 1}}, "rationale": {"en": "These are opposed answers to this explicit policy commitment; shared aspects are scored in the other component.", "he": "אלה תשובות מנוגדות להתחייבות המדיניות המפורשת; היבטים משותפים נבחנים במרכיב האחר.", "ru": "Это противоположные ответы на конкретный вопрос политики; общие аспекты учитываются другим компонентом."}}}, {"id": "family_routes", "en": "Adoption and surrogacy policy", "he": "מדיניות אימוץ ופונדקאות", "weight": 1, "values": [{"id": "separate", "en": "Decide access routes separately", "he": "להסדיר את דרכי הגישה בנפרד", "ru": "Отдельно решать вопросы доступа"}, {"id": "adoption", "en": "Equal adoption criteria; surrogacy separate", "he": "תנאי אימוץ שווים; פונדקאות בנפרד", "ru": "Равные критерии усыновления; суррогатное материнство отдельно"}, {"id": "all", "en": "Equal adoption and surrogacy criteria", "he": "תנאים שווים באימוץ ובפונדקאות", "ru": "Равные критерии обоих путей"}, {"id": "traditional", "en": "Reserve routes for different-sex couples", "he": "לייחד מסלולים לזוגות ממינים שונים", "ru": "Оставить эти пути разнополым парам"}], "ru": "Усыновление и суррогатное материнство", "similarity": {"matrix": {"separate": {"separate": 1, "adoption": 0.5, "all": 0.25, "traditional": 0.25}, "adoption": {"separate": 0.5, "adoption": 1, "all": 0.75, "traditional": 0}, "all": {"separate": 0.25, "adoption": 0.75, "all": 1, "traditional": 0}, "traditional": {"separate": 0.25, "adoption": 0, "all": 0, "traditional": 1}}, "rationale": {"en": "Equal adoption overlaps strongly with equal adoption and surrogacy; leaving eligibility separate does not imply endorsing either endpoint.", "he": "אימוץ שוויוני חופף במידה רבה לאימוץ ולפונדקאות שוויוניים; הסדרה נפרדת אינה תמיכה אוטומטית באף קצה.", "ru": "Равное усыновление близко к равному доступу к обоим путям; отдельное регулирование не означает поддержки какого-либо крайнего варианта."}}}], "options": [{"id": "recognition", "en": "Give same-sex parents equal legal status; decide adoption and surrogacy eligibility separately.", "he": "להעניק להורים מאותו מין מעמד משפטי שווה, ולהסדיר בנפרד את הזכאות לאימוץ ולפונדקאות.", "profile": {"parent_status": "yes", "family_routes": "separate"}, "ru": "Предоставить однополым родителям равный юридический статус, отдельно решая вопросы доступа к усыновлению и суррогатному материнству."}, {"id": "adoption", "en": "Provide equal parental recognition and equal adoption criteria; regulate surrogacy separately.", "he": "להעניק הכרה הורית שווה ותנאי אימוץ שווים, ולהסדיר פונדקאות בנפרד.", "profile": {"parent_status": "yes", "family_routes": "adoption"}, "ru": "Обеспечить равное признание родительства и одинаковые критерии усыновления, регулируя суррогатное материнство отдельно."}, {"id": "all_routes", "en": "Apply equal parental recognition and the same eligibility criteria to adoption and surrogacy.", "he": "להעניק הכרה הורית שווה ולהחיל תנאי זכאות זהים באימוץ ובפונדקאות.", "profile": {"parent_status": "yes", "family_routes": "all"}, "ru": "Обеспечить равное признание родительства и одинаковые критерии доступа к усыновлению и суррогатному материнству."}, {"id": "traditional", "en": "Do not give same-sex couples equivalent joint parental status, and reserve adoption and surrogacy routes for different-sex couples.", "he": "לא להעניק לזוגות מאותו מין מעמד הורי משותף מקביל, ולייחד מסלולי אימוץ ופונדקאות לזוגות ממינים שונים.", "profile": {"parent_status": "no", "family_routes": "traditional"}, "ru": "Не предоставлять однополым парам эквивалентный совместный родительский статус и оставить усыновление и суррогатное материнство разнополым парам."}], "note": "Choose the policy package closest to your view. Each package has two separately scored components; choosing a package does not establish views beyond its wording.", "note_he": "בחרו את חבילת המדיניות הקרובה ביותר לעמדתכם. בכל חלופה שני מרכיבים שמושווים בנפרד; הבחירה אינה מעידה על עמדות מעבר למה שנכתב.", "ru": "Как закон должен признавать семьи однополых пар?", "note_ru": "Выберите пакет политики, наиболее близкий к вашей позиции. Его два компонента сравниваются отдельно; выбор не означает согласия с положениями, которые здесь не указаны.", "help": {"overview": {"en": "Recognizing someone as a legal parent differs from setting eligibility for adoption or surrogacy. Debates involve equal treatment, children's interests and competing views of family. These questions can be regulated separately rather than as one all-or-nothing package.", "he": "הכרה באדם כהורה משפטי נפרדת מקביעת זכאות לאימוץ או לפונדקאות. הדיון כולל שוויון, טובת ילדים ותפיסות שונות של משפחה. אפשר להסדיר את השאלות בנפרד ולא כחבילה של הכול או לא כלום.", "ru": "Признание юридического родительства отличается от права на усыновление или суррогатное материнство. Обсуждаются равенство, интересы детей и разные представления о семье. Эти вопросы можно регулировать отдельно."}, "links": [{"url": "https://en.idi.org.il/articles/6539", "title": {"en": "IDI: Civil unions for all", "he": "IDI: ברית זוגיות לכולם", "ru": "IDI: гражданские союзы для всех"}, "kind": "analysis", "language": "en"}, {"url": "https://be-yahad.org.il/plans/?bennett_plans_cat=198", "title": {"en": "Beyahad: published policy plans", "he": "ביחד: תוכניות המדיניות", "ru": "Беяхад: опубликованные планы"}, "kind": "party", "language": "he"}], "discussion": {"en": ["Which rights belong to the child regardless of how the family was formed?", "Should legal recognition of an existing family be decided separately from access to adoption or surrogacy?"], "he": ["אילו זכויות שייכות לילד ללא קשר לדרך שבה נוצרה המשפחה?", "האם הכרה במשפחה קיימת צריכה להיות נפרדת מהגישה לאימוץ או לפונדקאות?"], "ru": ["Какие права принадлежат ребёнку независимо от способа создания семьи?", "Нужно ли отделять признание существующей семьи от доступа к усыновлению или суррогатному материнству?"]}}}, {"id": "Q16", "short": false, "domain": "services", "en": "School choice and admissions: how should funding and pupil selection work?", "he": "בחירת בית ספר וקבלת תלמידים: כיצד יש לקבוע את המימון ואת כללי הקבלה?", "dimensions": [{"id": "funding_model", "en": "Funding model", "he": "מודל התקצוב", "weight": 1, "values": [{"id": "voucher", "en": "Funding follows the child through a voucher", "he": "שובר אישי שהולך עם התלמיד", "ru": "Ваучер следует за ребёнком"}, {"id": "institution", "en": "Direct institutional budgets", "he": "תקצוב ישיר של מוסדות", "ru": "Прямое финансирование учреждений"}], "ru": "Модель финансирования", "similarity": {"matrix": {"voucher": {"voucher": 1, "institution": 0.25}, "institution": {"voucher": 0.25, "institution": 1}}, "rationale": {"en": "Both use public school funding, but differ substantially in who directs it.", "he": "שני המודלים משתמשים במימון ציבורי לחינוך, אך שונים מהותית במי שמכוון אותו.", "ru": "Обе модели используют бюджетное финансирование школ, но существенно различаются тем, кто им распоряжается."}}}, {"id": "admissions", "en": "Admissions rules", "he": "כללי קבלה", "weight": 1, "values": [{"id": "open", "en": "Open access with allocation when oversubscribed", "he": "קבלה פתוחה והקצאה בעת ביקוש יתר", "ru": "Открытый приём с распределением при избытке заявлений"}, {"id": "selective", "en": "School-specific published selection criteria", "he": "קריטריוני מיון מפורסמים לפי בית הספר", "ru": "Опубликованные критерии отбора конкретной школы"}], "ru": "Правила приёма", "similarity": {"matrix": {"open": {"open": 1, "selective": 0}, "selective": {"open": 0, "selective": 1}}, "rationale": {"en": "Open access and selective admission are opposing admission rules.", "he": "קבלה פתוחה ומיון הם כללי קבלה מנוגדים.", "ru": "Открытый приём и отбор — противоположные правила поступления."}}}], "options": [{"id": "open_vouchers", "en": "Let funding follow the child to a parent-chosen school, with open admissions and a fair allocation rule when places run out.", "he": "לתקצב באמצעות שובר לבית הספר שבחרו ההורים, עם קבלה פתוחה וכלל הקצאה הוגן כשהביקוש עולה על מספר המקומות.", "profile": {"funding_model": "voucher", "admissions": "open"}, "ru": "Направлять ваучер за ребёнком в выбранную родителями школу с открытым приёмом и справедливым распределением мест при избытке заявлений."}, {"id": "selective_vouchers", "en": "Let funding follow the child, while allowing schools to use published educational admission criteria.", "he": "לתקצב באמצעות שובר שהולך עם התלמיד, ולאפשר לבתי הספר להשתמש בקריטריוני קבלה חינוכיים שיפורסמו מראש.", "profile": {"funding_model": "voucher", "admissions": "selective"}, "ru": "Направлять финансирование за ребёнком, разрешая школам применять заранее опубликованные образовательные критерии отбора."}, {"id": "public_open", "en": "Fund institutions directly and offer choice within a public network, with open admissions and fair allocation.", "he": "לתקצב מוסדות ישירות ולהציע בחירה בתוך רשת ציבורית, עם קבלה פתוחה והקצאה הוגנת.", "profile": {"funding_model": "institution", "admissions": "open"}, "ru": "Финансировать школы напрямую и предлагать выбор внутри государственной сети с открытым приёмом и справедливым распределением мест."}, {"id": "public_specialist", "en": "Fund institutions directly but allow specialist schools to select pupils under published educational criteria.", "he": "לתקצב מוסדות ישירות, אך לאפשר לבתי ספר ייחודיים למיין תלמידים לפי קריטריונים חינוכיים מפורסמים.", "profile": {"funding_model": "institution", "admissions": "selective"}, "ru": "Финансировать школы напрямую, но разрешить специализированным школам отбирать учеников по опубликованным образовательным критериям."}], "note": "Choose the policy package closest to your view. Each package has two separately scored components; choosing a package does not establish views beyond its wording.", "note_he": "בחרו את חבילת המדיניות הקרובה ביותר לעמדתכם. בכל חלופה שני מרכיבים שמושווים בנפרד; הבחירה אינה מעידה על עמדות מעבר למה שנכתב.", "ru": "Выбор школы и приём учеников: как организовать финансирование и отбор?", "note_ru": "Выберите пакет политики, наиболее близкий к вашей позиции. Его два компонента сравниваются отдельно; выбор не означает согласия с положениями, которые здесь не указаны.", "help": {"overview": {"en": "This question concerns school choice, funding and admissions. Common-core requirements are covered in the separate school-curriculum question. A voucher directs public funding with the pupil rather than directly to a school. Choice can widen access, but admission rules, transport and extra fees affect who benefits. Funding design and selective admissions are separate policy decisions.", "he": "שאלה זו עוסקת בבחירת בית ספר, במימון ובקבלה. חובת לימודי ליבה נבחנת בשאלה הנפרדת על תוכנית הלימודים. שובר מעביר מימון ציבורי עם התלמיד במקום ישירות למוסד. בחירה עשויה להרחיב נגישות, אך כללי קבלה, תחבורה ותשלומים נוספים משפיעים על הנהנים. מודל המימון ומיון תלמידים הם החלטות נפרדות.", "ru": "Этот вопрос касается выбора школы, финансирования и приёма. Обязательное общее ядро рассматривается в отдельном вопросе о школьной программе. Ваучер направляет бюджетные средства за учеником, а не прямо школе. Выбор может расширить доступ, но приём, транспорт и доплаты влияют на получателей выгод. Финансирование и отбор — разные решения."}, "links": [{"url": "https://www.oecd.org/en/publications/balancing-school-choice-and-equity_2592c974-en/full-report/component-5.html", "title": {"en": "OECD: School choice, student sorting and equity", "he": "OECD: בחירת בית ספר, מיון תלמידים ושוויון", "ru": "ОЭСР: выбор школы, отбор учеников и равенство"}, "kind": "research", "language": "en"}, {"url": "https://zehut.org.il/platform/full", "title": {"en": "Zehut: published program", "he": "זהות: המצע המפורסם", "ru": "Зеут: опубликованная программа"}, "kind": "party", "language": "he"}], "discussion": {"en": ["Can families genuinely choose if transport, extra fees or admissions screening exclude them?", "What happens to pupils and schools left behind when funding follows those who move?"], "he": ["האם משפחות יכולות לבחור באמת כשמחיר הנסיעה, תשלומים נוספים או מיון חוסמים אותן?", "מה קורה לתלמידים ולבתי הספר שנותרו מאחור כשהתקציב עובר עם העוזבים?"], "ru": ["Реален ли выбор, если мешают транспорт, доплаты или отбор?", "Что происходит с учениками и школами, оставшимися без средств, ушедших вслед за другими детьми?"]}}}, {"id": "Q17", "short": false, "domain": "economy", "en": "What should be the main approach to affordable housing?", "he": "מה צריכה להיות הדרך המרכזית לקידום דיור בר־השגה?", "dimensions": [{"id": "public_stock", "en": "Expand publicly owned rental housing", "he": "הרחבת מלאי דיור ציבורי להשכרה", "weight": 1, "values": [{"id": "yes", "en": "Yes", "he": "כן", "ru": "Да"}, {"id": "no", "en": "No", "he": "לא", "ru": "Нет"}], "ru": "Расширение государственного арендного фонда", "similarity": {"matrix": {"yes": {"yes": 1, "no": 0}, "no": {"yes": 0, "no": 1}}, "rationale": {"en": "These are opposed answers to this explicit policy commitment; shared aspects are scored in the other component.", "he": "אלה תשובות מנוגדות להתחייבות המדיניות המפורשת; היבטים משותפים נבחנים במרכיב האחר.", "ru": "Это противоположные ответы на конкретный вопрос политики; общие аспекты учитываются другим компонентом."}}}, {"id": "housing_tool", "en": "Main housing tool", "he": "הכלי המרכזי לדיור", "weight": 1, "values": [{"id": "public_build", "en": "Public construction", "he": "בנייה ציבורית", "ru": "Государственное строительство"}, {"id": "acquire", "en": "Acquire homes from private builders", "he": "רכישת דירות מקבלנים", "ru": "Покупка квартир у частных застройщиков"}, {"id": "private_supply", "en": "Private construction incentives", "he": "תמריצים לבנייה פרטית", "ru": "Стимулы частному строительству"}, {"id": "rent_support", "en": "Rent assistance", "he": "סיוע בשכר דירה", "ru": "Помощь с оплатой аренды"}, {"id": "land_reform", "en": "Land-market reform", "he": "רפורמה בשוק הקרקע", "ru": "Реформа земельного рынка"}], "ru": "Основной жилищный инструмент", "similarity": {"matrix": {"public_build": {"public_build": 1, "acquire": 0.75, "private_supply": 0.25, "rent_support": 0, "land_reform": 0.25}, "acquire": {"public_build": 0.75, "acquire": 1, "private_supply": 0.5, "rent_support": 0.25, "land_reform": 0.25}, "private_supply": {"public_build": 0.25, "acquire": 0.5, "private_supply": 1, "rent_support": 0.25, "land_reform": 0.75}, "rent_support": {"public_build": 0, "acquire": 0.25, "private_supply": 0.25, "rent_support": 1, "land_reform": 0}, "land_reform": {"public_build": 0.25, "acquire": 0.25, "private_supply": 0.75, "rent_support": 0, "land_reform": 1}}, "rationale": {"en": "Public construction and acquisition share public stock; private construction and land reform share supply expansion.", "he": "בנייה ורכישה ציבוריות חולקות מלאי ציבורי; בנייה פרטית ורפורמת קרקע חולקות הרחבת היצע.", "ru": "Государственное строительство и покупка создают публичный фонд; частная застройка и земельная реформа расширяют предложение."}}}], "options": [{"id": "public_build", "en": "Build a substantial new stock of publicly owned rental homes for eligible households.", "he": "לבנות מלאי גדול של דירות ציבוריות חדשות להשכרה לזכאים.", "profile": {"public_stock": "yes", "housing_tool": "public_build"}, "ru": "Построить значительный новый фонд государственного арендного жилья для имеющих право на него домохозяйств."}, {"id": "public_acquire", "en": "Expand public rental housing by buying homes from private builders, rather than making the state the builder.", "he": "להרחיב דיור ציבורי להשכרה באמצעות רכישת דירות מקבלנים, במקום שהמדינה תהיה הגוף הבונה.", "profile": {"public_stock": "yes", "housing_tool": "acquire"}, "ru": "Расширять государственный арендный фонд, покупая квартиры у частных застройщиков, а не делая государство застройщиком."}, {"id": "private_supply", "en": "Focus on private construction and long-term rental incentives, without expanding public ownership.", "he": "להתמקד בבנייה פרטית ובתמריצים לשכירות ארוכת טווח, ללא הרחבת הבעלות הציבורית.", "profile": {"public_stock": "no", "housing_tool": "private_supply"}, "ru": "Сосредоточиться на частном строительстве и стимулах для долгосрочной аренды, не расширяя государственную собственность."}, {"id": "rent_support", "en": "Direct additional resources to rent assistance for households, rather than a larger public housing stock.", "he": "להפנות משאבים נוספים לסיוע בשכר דירה למשקי בית, במקום להגדיל את מלאי הדיור הציבורי.", "profile": {"public_stock": "no", "housing_tool": "rent_support"}, "ru": "Направлять дополнительные средства на помощь домохозяйствам с оплатой аренды, а не на увеличение государственного жилищного фонда."}, {"id": "land_reform", "en": "Prioritize releasing land and simplifying development, without expanding publicly owned housing.", "he": "לתעדף שחרור קרקעות ופישוט תהליכי פיתוח, ללא הרחבת מלאי הדיור בבעלות ציבורית.", "profile": {"public_stock": "no", "housing_tool": "land_reform"}, "ru": "Отдать приоритет высвобождению земли и упрощению застройки без расширения государственного жилищного фонда."}], "note": "Choose the policy package closest to your view. Each package has two separately scored components; choosing a package does not establish views beyond its wording.", "note_he": "בחרו את חבילת המדיניות הקרובה ביותר לעמדתכם. בכל חלופה שני מרכיבים שמושווים בנפרד; הבחירה אינה מעידה על עמדות מעבר למה שנכתב.", "ru": "Какой подход должен быть главным для обеспечения доступного жилья?", "note_ru": "Выберите пакет политики, наиболее близкий к вашей позиции. Его два компонента сравниваются отдельно; выбор не означает согласия с положениями, которые здесь не указаны.", "help": {"overview": {"en": "Affordable housing can come from public rental stock, private supply or help with rent. Building or buying public homes changes ownership; rent assistance does not. Each approach differs in speed, cost and who receives the benefit.", "he": "דיור בר־השגה יכול להגיע ממלאי ציבורי, מהיצע פרטי או מסיוע בשכר דירה. בנייה או רכישה ציבורית משנות בעלות; סיוע בשכירות אינו משנה אותה. לכל מסלול קצב, עלות וזכאים שונים.", "ru": "Доступное жильё обеспечивают государственный фонд, частное предложение или помощь с арендой. Государственное строительство и покупка меняют собственность, а субсидия на аренду — нет. Подходы различаются скоростью, стоимостью и получателями."}, "links": [{"url": "https://www.oecd.org/en/publications/oecd-economic-surveys-israel-2025_d6dd02bc-en/full-report/addressing-the-high-cost-of-living_bfe408a2.html", "title": {"en": "OECD: Addressing Israel's high cost of living", "he": "OECD: התמודדות עם יוקר המחיה בישראל", "ru": "ОЭСР: борьба с дороговизной в Израиле"}, "kind": "research", "language": "en"}, {"url": "https://democrats.org.il/wp-content/uploads/2025/09/agenda2025.pdf", "title": {"en": "Democrats: July 2025 agenda", "he": "הדמוקרטים: תוכנית יולי 2025", "ru": "Демократы: программа июля 2025 года"}, "kind": "party", "language": "he"}], "discussion": {"en": ["Which approach helps people needing a home now, and which changes supply over a decade?", "How can eligibility rules, location and maintenance prevent the benefit from missing those most in need?"], "he": ["איזה מסלול מסייע למי שזקוקים לבית עכשיו, ואיזה משנה את ההיצע בעשור הקרוב?", "כיצד כללי זכאות, מיקום ותחזוקה מבטיחים שהסיוע יגיע למי שזקוקים לו ביותר?"], "ru": ["Какой подход помогает нуждающимся в жилье сейчас, а какой меняет предложение за десятилетие?", "Как правила доступа, расположение и обслуживание направят помощь наиболее нуждающимся?"]}}}, {"id": "Q18", "short": false, "domain": "economy", "en": "How should wages, collective bargaining and industrial disputes be handled?", "he": "כיצד יש להסדיר שכר, משא ומתן קיבוצי וסכסוכי עבודה?", "dimensions": [{"id": "bargaining", "en": "Main bargaining model", "he": "מודל המשא ומתן המרכזי", "weight": 1, "values": [{"id": "collective", "en": "Strengthen collective bargaining", "he": "חיזוק המשא ומתן הקיבוצי", "ru": "Укрепление коллективных переговоров"}, {"id": "individual", "en": "Prioritize individual contracts", "he": "עדיפות לחוזים אישיים", "ru": "Приоритет индивидуальных договоров"}], "ru": "Основная модель переговоров", "similarity": {"matrix": {"collective": {"collective": 1, "individual": 0}, "individual": {"collective": 0, "individual": 1}}, "rationale": {"en": "Collective and individual bargaining assign negotiation power differently.", "he": "משא ומתן קיבוצי ואישי מחלקים את כוח המיקוח באופן שונה.", "ru": "Коллективные и индивидуальные переговоры по-разному распределяют переговорную силу."}}}, {"id": "disputes", "en": "Dispute-resolution approach", "he": "אופן יישוב סכסוכים", "weight": 1, "values": [{"id": "voluntary", "en": "Negotiation and voluntary mediation", "he": "משא ומתן וגישור מרצון", "ru": "Переговоры и добровольное посредничество"}, {"id": "essential_arbitration", "en": "Binding arbitration in essential services", "he": "בוררות מחייבת בשירותים חיוניים", "ru": "Обязательный арбитраж в жизненно важных службах"}, {"id": "all_arbitration", "en": "Binding arbitration across sectors", "he": "בוררות מחייבת בכלל הענפים", "ru": "Обязательный арбитраж во всех отраслях"}], "ru": "Порядок разрешения споров", "similarity": {"matrix": {"voluntary": {"voluntary": 1, "essential_arbitration": 0.5, "all_arbitration": 0}, "essential_arbitration": {"voluntary": 0.5, "essential_arbitration": 1, "all_arbitration": 0.5}, "all_arbitration": {"voluntary": 0, "essential_arbitration": 0.5, "all_arbitration": 1}}, "rationale": {"en": "Essential-service arbitration is a narrower intervention than arbitration across all sectors.", "he": "בוררות בשירותים חיוניים היא התערבות צרה יותר מבוררות בכלל הענפים.", "ru": "Арбитраж в жизненно важных службах — более узкое вмешательство, чем во всех отраслях."}}}], "options": [{"id": "collective_strikes", "en": "Strengthen unions and collective bargaining, with strikes available after negotiation and voluntary mediation.", "he": "לחזק התאגדות ומשא ומתן קיבוצי, עם אפשרות לשביתה לאחר משא ומתן וגישור מרצון.", "profile": {"bargaining": "collective", "disputes": "voluntary"}, "ru": "Укреплять профсоюзы и коллективные переговоры, сохраняя возможность забастовки после переговоров и добровольного посредничества."}, {"id": "collective_arbitration", "en": "Strengthen collective bargaining, but require binding arbitration in essential services.", "he": "לחזק משא ומתן קיבוצי, אך לחייב בוררות בשירותים חיוניים.", "profile": {"bargaining": "collective", "disputes": "essential_arbitration"}, "ru": "Укреплять коллективные переговоры, но требовать обязательного арбитража в жизненно важных службах."}, {"id": "individual", "en": "Prioritize individual employment contracts and resolve disputes through negotiation and voluntary mediation.", "he": "לתת עדיפות לחוזי עבודה אישיים וליישב סכסוכים במשא ומתן ובגישור מרצון.", "profile": {"bargaining": "individual", "disputes": "voluntary"}, "ru": "Отдать приоритет индивидуальным трудовым договорам и решать споры переговорами и добровольным посредничеством."}, {"id": "individual_arbitration", "en": "Prioritize individual contracts and use binding arbitration to resolve industrial disputes across sectors.", "he": "לתת עדיפות לחוזים אישיים ולהכריע בסכסוכי עבודה באמצעות בוררות מחייבת בכלל הענפים.", "profile": {"bargaining": "individual", "disputes": "all_arbitration"}, "ru": "Отдать приоритет индивидуальным договорам и применять обязательный арбитраж для трудовых споров во всех отраслях."}], "note": "Choose the policy package closest to your view. Each package has two separately scored components; choosing a package does not establish views beyond its wording.", "note_he": "בחרו את חבילת המדיניות הקרובה ביותר לעמדתכם. בכל חלופה שני מרכיבים שמושווים בנפרד; הבחירה אינה מעידה על עמדות מעבר למה שנכתב.", "ru": "Как регулировать оплату труда, коллективные переговоры и трудовые споры?", "note_ru": "Выберите пакет политики, наиболее близкий к вашей позиции. Его два компонента сравниваются отдельно; выбор не означает согласия с положениями, которые здесь не указаны.", "help": {"overview": {"en": "Collective bargaining lets workers negotiate jointly; individual contracts negotiate separately. Strikes create bargaining power but can disrupt essential services. Binding arbitration replaces some freedom to continue a dispute with a compulsory decision by an arbitrator.", "he": "משא ומתן קיבוצי מאפשר לעובדים להתמקח יחד; חוזים אישיים מסדירים תנאים בנפרד. שביתה יוצרת כוח מיקוח אך יכולה לשבש שירותים חיוניים. בוררות מחייבת מחליפה חלק מהחופש להמשיך בסכסוך בהחלטת בורר.", "ru": "Коллективные переговоры объединяют работников, индивидуальные договоры заключаются отдельно. Забастовка даёт переговорную силу, но может нарушать жизненно важные услуги. Обязательный арбитраж заменяет часть свободы продолжать спор решением арбитра."}, "links": [{"url": "https://www.ilo.org/ilo-helpdesk-questions-and-answers-business-and-collective-bargaining", "title": {"en": "ILO: Collective bargaining — questions and answers", "he": "ILO: שאלות ותשובות על משא ומתן קיבוצי", "ru": "МОТ: вопросы и ответы о коллективных переговорах"}, "kind": "research", "language": "en"}, {"url": "https://zionutdatit.org.il/wp-content/uploads/2021/12/כלכלה.pdf", "title": {"en": "Religious Zionism: economic proposals (2021)", "he": "הציונות הדתית: הצעות כלכליות (2021)", "ru": "Религиозный сионизм: экономические предложения (2021)"}, "kind": "party", "language": "he"}], "discussion": {"en": ["Who decides which services are essential, and how much disruption is tolerable during a dispute?", "How can an arbitrator be independent, and what bargaining power remains if a strike is unavailable?"], "he": ["מי קובע אילו שירותים חיוניים, ומהו השיבוש שאפשר לשאת בזמן סכסוך?", "כיצד מבטיחים עצמאות לבורר, ואיזה כוח מיקוח נותר כשאי אפשר לשבות?"], "ru": ["Кто определяет жизненно важные службы и допустимый уровень нарушения их работы?", "Как обеспечить независимость арбитра и какая переговорная сила остаётся без забастовки?"]}}}, {"id": "Q19", "short": false, "domain": "security", "en": "What service framework should apply to Arab citizens?", "he": "איזו מסגרת שירות צריכה לחול על אזרחים ערבים?", "dimensions": [{"id": "compulsory", "en": "Compulsory service", "he": "חובת שירות", "weight": 1, "values": [{"id": "yes", "en": "Yes", "he": "כן", "ru": "Да"}, {"id": "no", "en": "No", "he": "לא", "ru": "Нет"}], "ru": "Обязательная служба", "similarity": {"matrix": {"yes": {"yes": 1, "no": 0}, "no": {"yes": 0, "no": 1}}, "rationale": {"en": "These are opposed answers to this explicit policy commitment; shared aspects are scored in the other component.", "he": "אלה תשובות מנוגדות להתחייבות המדיניות המפורשת; היבטים משותפים נבחנים במרכיב האחר.", "ru": "Это противоположные ответы на конкретный вопрос политики; общие аспекты учитываются другим компонентом."}}}, {"id": "service_model", "en": "Service framework", "he": "מסגרת השירות", "weight": 1, "values": [{"id": "civilian_choice", "en": "Choice among civilian placements", "he": "בחירה בין מסגרות שירות אזרחי", "ru": "Выбор гражданских мест службы"}, {"id": "military_priority", "en": "Military priority with civilian alternative", "he": "עדיפות צבאית עם חלופה אזרחית", "ru": "Приоритет армии с гражданской альтернативой"}, {"id": "community", "en": "Community-run voluntary service", "he": "שירות קהילתי התנדבותי", "ru": "Добровольная служба под управлением общины"}, {"id": "integrated", "en": "Voluntary national military/civilian routes", "he": "מסלולים ארציים צבאיים ואזרחיים מרצון", "ru": "Добровольные общенациональные военные и гражданские программы"}, {"id": "none", "en": "No dedicated service framework", "he": "ללא מסגרת שירות ייעודית", "ru": "Без специальной системы службы"}], "ru": "Система службы", "similarity": {"matrix": {"civilian_choice": {"civilian_choice": 1, "military_priority": 0.5, "community": 0.5, "integrated": 0.5, "none": 0}, "military_priority": {"civilian_choice": 0.5, "military_priority": 1, "community": 0, "integrated": 0.75, "none": 0}, "community": {"civilian_choice": 0.5, "military_priority": 0, "community": 1, "integrated": 0.5, "none": 0.25}, "integrated": {"civilian_choice": 0.5, "military_priority": 0.75, "community": 0.5, "integrated": 1, "none": 0}, "none": {"civilian_choice": 0, "military_priority": 0, "community": 0.25, "integrated": 0, "none": 1}}, "rationale": {"en": "Credit reflects shared civilian or military pathways; the separate compulsory-service component captures coercion.", "he": "החפיפה משקפת מסלולים אזרחיים או צבאיים משותפים; מרכיב חובת השירות הנפרד מייצג כפייה.", "ru": "Сходство отражает общие гражданские или военные пути; обязательность учитывается отдельным компонентом."}}}], "options": [{"id": "civilian_required", "en": "Require civilian service, with a choice of placements in healthcare, emergency services, education or local communities.", "he": "לחייב שירות אזרחי, עם בחירה בין בריאות, חירום, חינוך או מסגרות קהילתיות.", "profile": {"compulsory": "yes", "service_model": "civilian_choice"}, "ru": "Ввести обязательную гражданскую службу с выбором мест в здравоохранении, экстренных службах, образовании или местных сообществах."}, {"id": "universal_military", "en": "Apply the same service obligation as to other citizens: military service where needed, with a civilian alternative.", "he": "להחיל חובת שירות כמו על יתר האזרחים: שירות צבאי לפי הצורך, עם חלופה אזרחית.", "profile": {"compulsory": "yes", "service_model": "military_priority"}, "ru": "Установить ту же обязанность служить, что и для остальных граждан: военная служба по потребностям армии с гражданской альтернативой."}, {"id": "community_voluntary", "en": "Keep service voluntary and support community-run programs shaped by Arab municipalities and civil society.", "he": "להשאיר את השירות התנדבותי ולתמוך בתוכניות קהילתיות בעיצוב רשויות ערביות והחברה האזרחית.", "profile": {"compulsory": "no", "service_model": "community"}, "ru": "Оставить службу добровольной и поддерживать общинные программы, разработанные арабскими муниципалитетами и гражданским обществом."}, {"id": "national_voluntary", "en": "Keep service voluntary while opening military and national civilian routes on equal terms.", "he": "להשאיר את השירות התנדבותי ולפתוח מסלולים צבאיים ואזרחיים ארציים בתנאים שווים.", "profile": {"compulsory": "no", "service_model": "integrated"}, "ru": "Оставить службу добровольной, открыв на равных условиях военные и общенациональные гражданские программы."}, {"id": "no_framework", "en": "Do not create a service obligation or a dedicated national-service framework; invest directly in ordinary public services.", "he": "לא ליצור חובת שירות או מסגרת שירות לאומי ייעודית; להשקיע ישירות בשירותים ציבוריים רגילים.", "profile": {"compulsory": "no", "service_model": "none"}, "ru": "Не создавать ни обязанности служить, ни особой системы национальной службы, а вкладывать средства непосредственно в обычные общественные услуги."}], "note": "Choose the policy package closest to your view. Each package has two separately scored components; choosing a package does not establish views beyond its wording.", "note_he": "בחרו את חבילת המדיניות הקרובה ביותר לעמדתכם. בכל חלופה שני מרכיבים שמושווים בנפרד; הבחירה אינה מעידה על עמדות מעבר למה שנכתב.", "ru": "Какая система службы должна распространяться на арабских граждан?", "note_ru": "Выберите пакет политики, наиболее близкий к вашей позиции. Его два компонента сравниваются отдельно; выбор не означает согласия с положениями, которые здесь не указаны.", "help": {"overview": {"en": "Civilian service can contribute to communities without being military service. The dispute concerns compulsory versus voluntary participation, who controls placements, and how citizenship obligations relate to Arab national identity and equal access to opportunities.", "he": "שירות אזרחי יכול לתרום לקהילה בלי להיות שירות צבאי. המחלוקת עוסקת בחובה לעומת התנדבות, בזהות הגוף המנהל וביחס בין חובות אזרחיות, זהות לאומית ערבית ושוויון הזדמנויות.", "ru": "Гражданская служба позволяет помогать сообществу вне армии. Спор касается обязательности, управления местами службы и соотношения гражданских обязанностей с арабской национальной идентичностью и равным доступом к возможностям."}, "links": [{"url": "https://en.idi.org.il/centers/4462/4465", "title": {"en": "IDI: Jewish–Arab dialogue on service and citizenship", "he": "IDI: שיח יהודי–ערבי על שירות ואזרחות", "ru": "IDI: еврейско-арабский диалог о службе и гражданстве"}, "kind": "discussion", "language": "en"}, {"url": "https://beytenu.org.il/party-platform/", "title": {"en": "Yisrael Beytenu: party platform", "he": "ישראל ביתנו: מצע המפלגה", "ru": "Наш дом Израиль: программа партии"}, "kind": "party", "language": "he"}], "discussion": {"en": ["Who should design placements so that service meets real community needs and earns trust?", "How should an obligation relate to equal rights, opportunities and objections of national identity or conscience?"], "he": ["מי יעצב את המסגרות כדי שהשירות יענה על צרכים קהילתיים אמיתיים ויזכה לאמון?", "כיצד חובת שירות צריכה להתייחס לשוויון זכויות והזדמנויות ולהתנגדות מטעמי זהות לאומית או מצפון?"], "ru": ["Кто должен разработать места службы, чтобы они отвечали реальным нуждам и вызывали доверие?", "Как обязанность соотносится с равными правами, возможностями и возражениями национальной идентичности или совести?"]}}}, {"id": "Q20", "short": false, "domain": "services", "en": "Which approach should lead climate and energy policy?", "he": "איזו גישה צריכה להוביל את מדיניות האקלים והאנרגיה?", "dimensions": [{"id": "binding_targets", "en": "Binding emissions targets", "he": "יעדי פליטות מחייבים", "weight": 1, "values": [{"id": "yes", "en": "Yes", "he": "כן", "ru": "Да"}, {"id": "no", "en": "No", "he": "לא", "ru": "Нет"}], "ru": "Обязательные цели по выбросам", "similarity": {"matrix": {"yes": {"yes": 1, "no": 0}, "no": {"yes": 0, "no": 1}}, "rationale": {"en": "These are opposed answers to this explicit policy commitment; shared aspects are scored in the other component.", "he": "אלה תשובות מנוגדות להתחייבות המדיניות המפורשת; היבטים משותפים נבחנים במרכיב האחר.", "ru": "Это противоположные ответы на конкретный вопрос политики; общие аспекты учитываются другим компонентом."}}}, {"id": "climate_tool", "en": "Main policy instrument", "he": "כלי המדיניות המרכזי", "weight": 1, "values": [{"id": "sector_budgets", "en": "Funded sectoral plans", "he": "תוכניות ענפיות מתוקצבות", "ru": "Финансируемые отраслевые планы"}, {"id": "carbon_price", "en": "Carbon pricing", "he": "תמחור פחמן", "ru": "Плата за углерод"}, {"id": "innovation", "en": "Technology and efficiency incentives", "he": "תמריצים לטכנולוגיה ולהתייעלות", "ru": "Стимулы для технологий и эффективности"}, {"id": "nuclear", "en": "Nuclear generation", "he": "ייצור חשמל גרעיני", "ru": "Атомная генерация"}], "ru": "Основной инструмент политики", "similarity": {"matrix": {"sector_budgets": {"sector_budgets": 1, "carbon_price": 0.5, "innovation": 0.5, "nuclear": 0.25}, "carbon_price": {"sector_budgets": 0.5, "carbon_price": 1, "innovation": 0.5, "nuclear": 0.25}, "innovation": {"sector_budgets": 0.5, "carbon_price": 0.5, "innovation": 1, "nuclear": 0.25}, "nuclear": {"sector_budgets": 0.25, "carbon_price": 0.25, "innovation": 0.25, "nuclear": 1}}, "rationale": {"en": "Plans, pricing and innovation can all reduce emissions through different tools; nuclear is a specific supply technology.", "he": "תכנון, תמחור וחדשנות עשויים להפחית פליטות בכלים שונים; גרעין הוא טכנולוגיית אספקה מסוימת.", "ru": "Планы, ценообразование и инновации сокращают выбросы разными инструментами; атомная энергетика — конкретная технология генерации."}}}], "options": [{"id": "sector_law", "en": "Set binding emissions targets in law and fund sector-by-sector plans for transport, buildings and energy.", "he": "לקבוע בחוק יעדי פליטות מחייבים ולתקצב תוכניות ענפיות לתחבורה, למבנים ולאנרגיה.", "profile": {"binding_targets": "yes", "climate_tool": "sector_budgets"}, "ru": "Закрепить обязательные цели по выбросам в законе и финансировать отраслевые планы для транспорта, зданий и энергетики."}, {"id": "carbon_price", "en": "Set binding emissions targets, but rely mainly on carbon pricing and let firms choose how to reduce emissions.", "he": "לקבוע יעדי פליטות מחייבים, אך להסתמך בעיקר על תמחור פחמן ולאפשר לחברות לבחור כיצד להפחית פליטות.", "profile": {"binding_targets": "yes", "climate_tool": "carbon_price"}, "ru": "Установить обязательные цели по выбросам, но опираться главным образом на плату за углерод, оставив компаниям выбор способов сокращения."}, {"id": "innovation", "en": "Avoid binding national targets; prioritize clean technology, efficiency and competitive energy markets.", "he": "להימנע מיעדים לאומיים מחייבים ולתעדף טכנולוגיה נקייה, התייעלות ושוק אנרגיה תחרותי.", "profile": {"binding_targets": "no", "climate_tool": "innovation"}, "ru": "Отказаться от обязательных общенациональных целей, сосредоточившись на чистых технологиях, эффективности и конкурентных энергорынках."}, {"id": "nuclear", "en": "Prioritize nuclear generation for reliable low-emission electricity, without binding national emissions targets.", "he": "לתעדף ייצור גרעיני לחשמל אמין ודל פליטות, ללא יעדי פליטות לאומיים מחייבים.", "profile": {"binding_targets": "no", "climate_tool": "nuclear"}, "ru": "Отдать приоритет атомной энергетике как надёжному низкоуглеродному источнику без обязательных национальных целей по выбросам."}, {"id": "nuclear_targets", "en": "Keep binding emissions targets, with nuclear generation as the main long-term supply strategy.", "he": "לשמור על יעדי פליטות מחייבים, עם ייצור גרעיני כאסטרטגיית אספקה מרכזית לטווח הארוך.", "profile": {"binding_targets": "yes", "climate_tool": "nuclear"}, "ru": "Сохранить обязательные цели по выбросам, сделав атомную энергетику основой долгосрочного энергоснабжения."}], "note": "Choose the policy package closest to your view. Each package has two separately scored components; choosing a package does not establish views beyond its wording.", "note_he": "בחרו את חבילת המדיניות הקרובה ביותר לעמדתכם. בכל חלופה שני מרכיבים שמושווים בנפרד; הבחירה אינה מעידה על עמדות מעבר למה שנכתב.", "ru": "Какой подход должен определять климатическую и энергетическую политику?", "note_ru": "Выберите пакет политики, наиболее близкий к вашей позиции. Его два компонента сравниваются отдельно; выбор не означает согласия с положениями, которые здесь не указаны.", "help": {"overview": {"en": "Binding emissions targets set an obligation; budgets, carbon pricing and technology incentives are ways to pursue it. Nuclear power concerns the supply mix. The debate weighs cost, reliability and emissions, and who carries implementation risks.", "he": "יעדי פליטות מחייבים קובעים חובה; תקציבים, תמחור פחמן ותמריצים טכנולוגיים הם דרכים להשגתה. אנרגיה גרעינית נוגעת לתמהיל האספקה. הדיון מאזן עלות, אמינות ופליטות ושואל מי נושא בסיכוני היישום.", "ru": "Обязательные цели устанавливают требование; бюджеты, плата за углерод и стимулы технологиям — способы его достижения. Атомная энергетика относится к составу генерации. Обсуждаются стоимость, надёжность, выбросы и распределение рисков."}, "links": [{"url": "https://en.idi.org.il/media/18866/carbon-pricing-in-israel-israel-2050-a-thriving-economy-in-a-sustainable-environment.pdf", "title": {"en": "IDI / Environment Ministry: Carbon pricing in Israel", "he": "IDI והמשרד להגנת הסביבה: תמחור פחמן בישראל", "ru": "IDI / Минэкологии: плата за углерод в Израиле"}, "kind": "research", "language": "en"}, {"url": "https://be-yahad.org.il/plans/enviroment/", "title": {"en": "Beyahad: environment plan", "he": "ביחד: התוכנית הסביבתית", "ru": "Беяхад: экологический план"}, "kind": "party", "language": "he"}], "discussion": {"en": ["How will progress be measured, and what happens when a sector misses a binding target?", "Who bears higher energy costs today, and how should reliability, long-term risk and emissions be balanced?"], "he": ["כיצד תימדד ההתקדמות, ומה יקרה כשענף לא יעמוד ביעד מחייב?", "מי יישא בעליית מחירי האנרגיה היום, וכיצד מאזנים אמינות, סיכון ארוך טווח ופליטות?"], "ru": ["Как измерять прогресс и что происходит, если отрасль не достигает обязательной цели?", "Кто платит за энергию сегодня и как сбалансировать надёжность, долгосрочный риск и выбросы?"]}}}, {"id": "Q21", "short": false, "domain": "women", "en": "How should parties include women in their electoral lists?", "he": "כיצד צריכות מפלגות לשלב נשים ברשימותיהן לכנסת?", "dimensions": [{"id": "eligibility", "en": "Access to candidacy", "he": "אפשרות להתמודד", "weight": 1, "values": [{"id": "open", "en": "Open to women and men", "he": "פתוחה לנשים ולגברים", "ru": "Открыт женщинам и мужчинам"}, {"id": "exclude", "en": "Rules barring women from candidacy", "he": "כללים האוסרים על נשים להתמודד", "ru": "Запрет женщинам выдвигаться"}], "ru": "Допуск к выдвижению", "similarity": {"matrix": {"open": {"open": 1, "exclude": 0}, "exclude": {"open": 0, "exclude": 1}}, "rationale": {"en": "Open candidacy and exclusion on grounds of sex are opposed. This component concerns a party’s own rules and practice, not whether it supports a nationwide legal requirement.", "he": "פתיחת ההתמודדות והדרה על בסיס מין הן עמדות מנוגדות. המרכיב עוסק בכללי המפלגה ובנוהג שלה, ולא בתמיכתה בחובה חוקית לכל המפלגות.", "ru": "Открытое выдвижение и исключение по признаку пола противоположны. Здесь оцениваются правила и практика самой партии, а не её поддержка общего закона."}}}, {"id": "representation", "en": "Mechanism for representation", "he": "מנגנון להבטחת ייצוג", "weight": 1, "values": [{"id": "none", "en": "No special mechanism", "he": "ללא מנגנון מיוחד", "ru": "Без специальных мер"}, {"id": "incentives", "en": "Recruitment and financial incentives", "he": "עידוד התמודדות ותמריצים כספיים", "ru": "Поощрение участия и финансовые стимулы"}, {"id": "quota", "en": "Guaranteed minimum in viable places", "he": "ייצוג מינימלי מובטח במקומות ריאליים", "ru": "Минимальная квота на проходных местах"}, {"id": "parity", "en": "Parity and alternating places", "he": "שוויון מספרי ומקומות לסירוגין", "ru": "Паритет и чередование мест"}], "ru": "Механизм обеспечения представительства", "similarity": {"matrix": {"none": {"none": 1, "incentives": 0.5, "quota": 0.25, "parity": 0}, "incentives": {"none": 0.5, "incentives": 1, "quota": 0.75, "parity": 0.5}, "quota": {"none": 0.25, "incentives": 0.75, "quota": 1, "parity": 0.75}, "parity": {"none": 0, "incentives": 0.5, "quota": 0.75, "parity": 1}}, "rationale": {"en": "Incentives, minimum guarantees and parity share a representation goal but impose different constraints. Actual list percentages do not establish a quota policy.", "he": "תמריצים, הבטחת מינימום ושוויון מספרי חולקים יעד של ייצוג אך מטילים מגבלות שונות. שיעור הנשים בפועל אינו מוכיח מדיניות מכסות.", "ru": "Стимулы, минимальные квоты и паритет преследуют общую цель, но по-разному ограничивают отбор. Доля женщин в списке сама по себе не доказывает поддержку квот."}}}], "options": [{"id": "party_autonomy", "en": "Reserve the party’s political representation for men: bar women from its electoral list on religious grounds, as Shas and United Torah Judaism do, with no requirement for women’s representation.", "he": "לייחד את הייצוג הפוליטי של המפלגה לגברים בלבד: לאסור על נשים להתמודד ברשימתה מטעמים דתיים, כפי שנוהגות ש״ס ויהדות התורה, ללא דרישה לייצוג נשים.", "profile": {"eligibility": "exclude", "representation": "none"}, "ru": "Оставить политическое представительство партии исключительно мужчинам: запретить женщинам выдвигаться в её списке по религиозным соображениям, как в ШАС и «Яхадут ха-Тора», без требований к женскому представительству."}, {"id": "open_selection", "en": "Open candidacy to women and men; choose candidates without gender quotas or special incentives.", "he": "לפתוח התמודדות לנשים ולגברים ולבחור מועמדים ללא מכסות מגדריות או תמריצים מיוחדים.", "profile": {"eligibility": "open", "representation": "none"}, "ru": "Открыть выдвижение женщинам и мужчинам; выбирать кандидатов без гендерных квот и специальных стимулов."}, {"id": "incentives", "en": "Open candidacy equally and encourage women through recruitment programmes and party-funding incentives, without binding quotas.", "he": "לפתוח התמודדות שוויונית ולעודד נשים באמצעות תוכניות גיוס ותמריצים במימון מפלגות, ללא מכסות מחייבות.", "profile": {"eligibility": "open", "representation": "incentives"}, "ru": "Обеспечить открытое выдвижение и поощрять участие женщин программами привлечения и финансовыми стимулами для партий, без обязательных квот."}, {"id": "minimum_quota", "en": "Open candidacy equally and reserve a minimum share of viable list places for women, while leaving other places to ordinary selection.", "he": "לפתוח התמודדות שוויונית ולהבטיח לנשים שיעור מינימלי מהמקומות הריאליים; יתר המקומות ייקבעו בהליך הבחירה הרגיל.", "profile": {"eligibility": "open", "representation": "quota"}, "ru": "Обеспечить открытое выдвижение и минимальную долю женщин на проходных местах; остальные места распределять обычным порядком."}, {"id": "parity", "en": "Require equal representation, with women and men alternating throughout the electoral list.", "he": "לקבוע ייצוג שווה לנשים ולגברים, במקומות לסירוגין לאורך הרשימה.", "profile": {"eligibility": "open", "representation": "parity"}, "ru": "Обеспечить равное представительство женщин и мужчин с чередованием мест во всём списке."}], "note": "Choose the policy package closest to your view. Each package has two separately scored components; choosing a package does not establish views beyond its wording.", "note_he": "בחרו את חבילת המדיניות הקרובה ביותר לעמדתכם. בכל חלופה שני מרכיבים שמושווים בנפרד; הבחירה אינה מעידה על עמדות מעבר למה שנכתב.", "ru": "Как партии должны обеспечивать представительство женщин в своих избирательных списках?", "note_ru": "Выберите пакет политики, наиболее близкий к вашей позиции. Его два компонента сравниваются отдельно; выбор не означает согласия с положениями, которые здесь не указаны.", "help": {"overview": {"en": "Shas and United Torah Judaism reserve their electoral lists for men on religious grounds. This is a restriction on women’s eligibility, not merely an absence of quotas. Access to candidacy, placement in viable seats and the method of achieving representation are separate issues. Supporters of quotas seek to overcome structural barriers; critics defend voter choice and party autonomy. A party can include women without supporting quotas, and a numerical balance can arise without a formal parity rule.", "he": "ש״ס ויהדות התורה מייחדות את רשימותיהן לגברים מטעמים דתיים. מדובר בהגבלה על עצם האפשרות של נשים להתמודד, ולא רק בהיעדר מכסות. אפשרות להתמודד, שיבוץ במקומות ריאליים והדרך להשגת ייצוג הם נושאים נפרדים. תומכי מכסות מבקשים להתגבר על חסמים מבניים; מבקרים מדגישים בחירת בוחרים ואוטונומיה מפלגתית. שילוב נשים אינו מוכיח תמיכה במכסות, ושוויון מספרי עשוי להתקיים ללא כלל רשמי.", "ru": "ШАС и «Яхадут ха-Тора» оставляют свои списки исключительно мужскими по религиозным соображениям. Это ограничение самого права женщин выдвигаться, а не просто отсутствие квот. Допуск к выдвижению, проходные места и механизм представительства — разные вопросы. Сторонники квот стремятся преодолеть структурные барьеры; критики защищают свободу выбора и самостоятельность партий. Наличие женщин не доказывает поддержку квот, а численный паритет может возникнуть без формального правила."}, "links": [{"url": "https://www.idi.org.il/articles/52982", "title": {"en": "IDI: Haredi political representation and the exclusion of women", "he": "המכון לדמוקרטיה: ייצוג פוליטי חרדי והדרת נשים", "ru": "IDI: ультраортодоксальное политическое представительство и исключение женщин"}, "kind": "analysis", "language": "he"}, {"url": "https://be-yahad.org.il/plans/women/", "title": {"en": "Beyahad: women’s equality programme", "he": "ביחד: תוכנית למעמד הנשים", "ru": "Беяхад: программа равноправия женщин"}, "kind": "party", "language": "he"}], "discussion": {"en": ["Should public funding depend on open candidacy or on the share of women in viable places?", "Who determines which places are viable when election outcomes are uncertain?", "How should women inside a community influence rules justified in that community’s name?"], "he": ["האם מימון ציבורי צריך להיות מותנה בפתיחת ההתמודדות או בשיעור נשים במקומות ריאליים?", "מי יקבע אילו מקומות ריאליים כאשר תוצאות הבחירות אינן ידועות?", "כיצד נשים בקהילה ישפיעו על כללים המוצדקים בשם הקהילה?"], "ru": ["Должно ли бюджетное финансирование зависеть от допуска женщин или от их доли на проходных местах?", "Кто определяет проходные места, если результат выборов неизвестен?", "Как женщины внутри общины могут влиять на правила, обосновываемые её традициями?"]}}}, {"id": "Q22", "short": false, "domain": "women", "en": "How should the state promote women’s equality in work, education and public life while addressing community traditions?", "he": "כיצד על המדינה לקדם שוויון לנשים בתעסוקה, בהשכלה ובחיים הציבוריים, תוך התייחסות למסורות קהילתיות?", "dimensions": [{"id": "equality_policy", "en": "State approach to equality", "he": "גישת המדינה לשוויון", "weight": 1, "values": [{"id": "active", "en": "Targeted measures to remove structural barriers", "he": "צעדים ייעודיים להסרת חסמים מבניים", "ru": "Специальные меры для устранения структурных барьеров"}, {"id": "formal", "en": "Equal legal rules without gender-specific programmes", "he": "כללים משפטיים שווים ללא תוכניות מגדריות ייעודיות", "ru": "Равные правовые условия без специальных гендерных программ"}, {"id": "community", "en": "Community autonomy over gender roles", "he": "אוטונומיה קהילתית בקביעת תפקידי מגדר", "ru": "Самостоятельность общин в определении гендерных ролей"}], "ru": "Роль государства в обеспечении равноправия", "similarity": {"matrix": {"active": {"active": 1, "formal": 0.75, "community": 0}, "formal": {"active": 0.75, "formal": 1, "community": 0.25}, "community": {"active": 0, "formal": 0.25, "community": 1}}, "rationale": {"en": "Active and formal equality share equal-rights principles but differ on targeted intervention. Deferring gender-role rules to communities can conflict with individual equality.", "he": "שוויון פעיל ופורמלי חולקים זכויות שוות אך נבדלים בהתערבות ייעודית. מסירת כללי תפקידי המגדר לקהילות עלולה להתנגש בשוויון הפרט.", "ru": "Активная политика и формальное равноправие разделяют принцип равных прав, но различаются специальными мерами. Передача общинам правил о гендерных ролях может противоречить личному равноправию."}}}, {"id": "separation", "en": "Gender separation in publicly funded settings", "he": "הפרדה מגדרית במסגרות במימון ציבורי", "weight": 1, "values": [{"id": "integrated", "en": "Common services as the rule", "he": "שירותים משותפים ככלל", "ru": "Совместные услуги как общее правило"}, {"id": "voluntary", "en": "Separate options with free choice and equal access", "he": "אפשרויות נפרדות עם בחירה חופשית ונגישות שווה", "ru": "Добровольные раздельные варианты при равном доступе"}, {"id": "community", "en": "Community rules may govern separate settings", "he": "כללי הקהילה יכולים לקבוע מסגרות נפרדות", "ru": "Общинные правила могут определять раздельные учреждения"}], "ru": "Гендерное разделение в бюджетных учреждениях", "similarity": {"matrix": {"integrated": {"integrated": 1, "voluntary": 0.5, "community": 0}, "voluntary": {"integrated": 0.5, "voluntary": 1, "community": 0.5}, "community": {"integrated": 0, "voluntary": 0.5, "community": 1}}, "rationale": {"en": "Optional separate provision partly overlaps with both common services and community separation. Consent, equal resources and access to alternatives matter; support for separation does not establish opposition to women’s employment.", "he": "אפשרות להפרדה מרצון חופפת חלקית לשירותים משותפים ולהפרדה קהילתית. הסכמה, משאבים שווים וחלופות חשובים; תמיכה בהפרדה אינה מוכיחה התנגדות לתעסוקת נשים.", "ru": "Добровольное разделение частично пересекается и с совместными услугами, и с общинным разделением. Важны согласие, равные ресурсы и альтернативы; поддержка разделения не означает отрицания права женщин работать."}}}], "options": [{"id": "active_common", "en": "Actively remove barriers to women’s employment, pay and public leadership, and support shared caregiving; provide common public services without gender separation as the rule.", "he": "להסיר באופן פעיל חסמים בפני נשים בתעסוקה, בשכר ובהנהגה ציבורית, ולתמוך בחלוקת הטיפול במשפחה; להפעיל ככלל שירותים ציבוריים ללא הפרדה מגדרית.", "profile": {"equality_policy": "active", "separation": "integrated"}, "ru": "Активно устранять барьеры для женщин в занятости, оплате труда и общественном руководстве, поддерживать совместную заботу о семье; бюджетные услуги по общему правилу предоставлять без гендерного разделения."}, {"id": "formal_common", "en": "Enforce equal legal access to jobs, education and leadership without gender-specific programmes; keep public services common to women and men.", "he": "לאכוף גישה משפטית שווה לעבודה, להשכלה ולהנהגה ללא תוכניות מגדריות ייעודיות; לקיים שירותים ציבוריים משותפים לנשים ולגברים.", "profile": {"equality_policy": "formal", "separation": "integrated"}, "ru": "Обеспечивать равный правовой доступ к работе, образованию и руководству без специальных гендерных программ; сохранять совместные общественные услуги."}, {"id": "active_choice", "en": "Actively remove barriers to women’s employment and public leadership; allow separate services where participation is voluntary, resources equal and a mixed alternative accessible.", "he": "להסיר באופן פעיל חסמים בפני נשים בתעסוקה ובהנהגה ציבורית; לאפשר שירותים נפרדים כאשר ההשתתפות מרצון, המשאבים שווים וחלופה מעורבת נגישה.", "profile": {"equality_policy": "active", "separation": "voluntary"}, "ru": "Активно устранять барьеры для женщин в занятости и общественном руководстве; допускать раздельные услуги при добровольном участии, равных ресурсах и доступной совместной альтернативе."}, {"id": "formal_choice", "en": "Guarantee women equal legal access to work, education and public leadership without special gender programmes; permit voluntary separate settings with equal resources and an accessible mixed alternative.", "he": "להבטיח לנשים גישה משפטית שווה לעבודה, להשכלה ולהנהגה ציבורית ללא תוכניות מגדריות מיוחדות; להתיר מסגרות נפרדות מרצון עם משאבים שווים וחלופה מעורבת נגישה.", "profile": {"equality_policy": "formal", "separation": "voluntary"}, "ru": "Гарантировать женщинам равный правовой доступ к работе, образованию и общественному руководству без специальных гендерных программ; разрешать добровольные раздельные учреждения при равных ресурсах и доступной совместной альтернативе."}, {"id": "community_autonomy", "en": "Allow religious communities to reserve their political leadership and public representation for men, and to maintain gender-separated institutions with public funding; limit state intervention in these rules.", "he": "לאפשר לקהילות דתיות לייחד את הנהגתן הפוליטית ואת ייצוגן הציבורי לגברים בלבד, ולקיים מוסדות בהפרדה מגדרית במימון ציבורי; לצמצם את התערבות המדינה בכללים אלה.", "profile": {"equality_policy": "community", "separation": "community"}, "ru": "Позволить религиозным общинам сохранять политическое руководство и общественное представительство исключительно за мужчинами, а также содержать раздельные учреждения за бюджетный счёт; ограничить вмешательство государства в эти правила."}], "note": "Choose the policy package closest to your view. Each package has two separately scored components; choosing a package does not establish views beyond its wording.", "note_he": "בחרו את חבילת המדיניות הקרובה ביותר לעמדתכם. בכל חלופה שני מרכיבים שמושווים בנפרד; הבחירה אינה מעידה על עמדות מעבר למה שנכתב.", "ru": "Как государству обеспечивать равноправие женщин в работе, образовании и общественной жизни с учётом общинных традиций?", "note_ru": "Выберите пакет политики, наиболее близкий к вашей позиции. Его два компонента сравниваются отдельно; выбор не означает согласия с положениями, которые здесь не указаны.", "help": {"overview": {"en": "Should women have equal access to public leadership, or may a community reserve political leadership and public representation for men? Traditional Haredi parties defend male-only political representation on religious grounds; Haredi women have also challenged this exclusion. This does not describe every Orthodox community or every managerial role. The answers also distinguish active equality policies from equal legal rights alone, and voluntary separate services from community rules. These are separate choices: support for gender separation alone does not establish support for excluding women from leadership.", "he": "האם לנשים צריכה להיות גישה שווה להנהגה ציבורית, או שקהילה רשאית לייחד הנהגה פוליטית וייצוג ציבורי לגברים? המפלגות החרדיות המסורתיות מצדיקות ייצוג פוליטי גברי בלבד מטעמים דתיים; גם נשים חרדיות פעלו נגד הדרה זו. אין בכך תיאור של כל קהילה דתית או של כל תפקיד ניהולי. התשובות מבחינות גם בין קידום פעיל של שוויון לבין זכויות משפטיות שוות בלבד, ובין שירותים נפרדים מרצון לבין כללי הקהילה. אלו בחירות נפרדות: תמיכה בהפרדה מגדרית לבדה אינה מוכיחה תמיכה בהדרת נשים מהנהגה.", "ru": "Должны ли женщины иметь равный доступ к общественному руководству, или община вправе оставить политическое руководство и общественное представительство исключительно мужчинам? Традиционные ультраортодоксальные партии обосновывают мужское политическое представительство религиозными соображениями; против этого исключения выступали и сами ультраортодоксальные женщины. Это не описание всех религиозных общин или всех управленческих должностей. Ответы также различают активные меры равноправия и только равные юридические права, добровольные раздельные услуги и общинные правила. Это отдельные вопросы: поддержка гендерного разделения сама по себе не означает поддержку исключения женщин из руководства."}, "links": [{"url": "https://www.idi.org.il/articles/52982", "title": {"en": "IDI: Haredi political representation and the exclusion of women", "he": "המכון לדמוקרטיה: ייצוג פוליטי חרדי והדרת נשים", "ru": "IDI: ультраортодоксальное политическое представительство и исключение женщин"}, "kind": "analysis", "language": "he"}, {"url": "https://be-yahad.org.il/plans/women/", "title": {"en": "Beyahad: equality, employment and public space", "he": "ביחד: שוויון, תעסוקה והמרחב הציבורי", "ru": "Беяхад: равноправие, занятость и общественное пространство"}, "kind": "party", "language": "he"}], "discussion": {"en": ["When is a choice genuinely voluntary if family or community pressure is strong?", "How can separate settings guarantee equal resources, opportunities and access for women staff?", "Which barriers need targeted action rather than equal legal rules alone?", "May a community reserve its political leadership and public representation for men if women within it want to stand for those roles?"], "he": ["מתי בחירה היא חופשית באמת תחת לחץ משפחתי או קהילתי?", "כיצד מסגרות נפרדות יבטיחו משאבים והזדמנויות שווים וגישה לנשות צוות?", "אילו חסמים דורשים פעולה ייעודית מעבר לכללים משפטיים שווים?", "האם קהילה רשאית לייחד את הנהגתה הפוליטית ואת ייצוגה הציבורי לגברים, כאשר נשים מתוכה מבקשות להתמודד על תפקידים אלה?"], "ru": ["Когда выбор действительно доброволен при сильном давлении семьи или общины?", "Как в раздельных учреждениях обеспечить равные ресурсы, возможности и доступ для сотрудниц?", "Какие барьеры требуют специальных мер помимо равных правовых условий?", "Вправе ли община оставлять политическое руководство и общественное представительство исключительно мужчинам, если женщины внутри неё хотят претендовать на эти роли?"]}}}]}</script><script>(() => {

  const words={
    en:{title:'Explore the issues',eyebrow:'Questions worth thinking through',intro:'These are dilemmas, not a list of correct answers. Each section explains the dispute, outlines competing approaches and asks what a workable policy would need to resolve.',back:'← Ideological Compass',approaches:'Competing approaches',challenges:'Open questions and challenges',reading:'Read and discuss',contents:'Jump to a topic',footer:'Independent reading guide for the research preview. Linked analyses have their own perspectives; party programs are identified as such. External texts may be in a different language. This guide does not change your quiz answers.'},
    he:{title:'להכיר את הסוגיות',eyebrow:'שאלות שכדאי לחשוב עליהן',intro:'אלה דילמות, לא רשימת תשובות נכונות. כל פרק מסביר את המחלוקת, מציג גישות מתחרות ושואל אילו בעיות מדיניות מעשית צריכה לפתור.',back:'→ מצפן אידאולוגי',approaches:'גישות מתחרות',challenges:'שאלות ואתגרים פתוחים',reading:'לקריאה ולדיון',contents:'מעבר לסוגיה',footer:'מדריך קריאה לתצוגת המחקר. לניתוחים המקושרים נקודות מבט משלהם; מצעי מפלגות מסומנים בהתאם. המקורות עשויים להיות בשפה אחרת. המדריך אינו משנה את התשובות לשאלון.'},
    ru:{title:'Разобраться в проблемах',eyebrow:'Вопросы, над которыми стоит подумать',intro:'Это дилеммы, а не список правильных ответов. Каждый раздел объясняет спор, описывает конкурирующие подходы и задаёт вопросы, которые должна решить работающая политика.',back:'← Идеологический Компас',approaches:'Конкурирующие подходы',challenges:'Открытые вопросы и трудности',reading:'Читать и обсуждать',contents:'Перейти к теме',footer:'Руководство для исследовательской версии. У внешних аналитических материалов есть собственная точка зрения; партийные программы обозначены отдельно. Тексты могут быть на другом языке. Эта страница не меняет ответы в опросе.'}
  };
  const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  function render(){
    const t=words[lang];
    document.documentElement.lang=lang;document.documentElement.dir=lang==='he'?'rtl':'ltr';document.title=t.title;
    for(const id of ['title','eyebrow','intro','footer','back']) document.getElementById(id).textContent=t[id];
    document.getElementById('back').href=`index.html?lang=${lang}`;
    document.getElementById('language').value=lang;
    document.getElementById('contents').innerHTML=`<label for="topic-jump">${esc(t.contents)}</label><select id="topic-jump"><option value="">—</option>${data.questions.map(q=>`<option value="${q.id}">${esc(q[lang])}</option>`).join('')}</select>`;
    document.getElementById('issue-sections').innerHTML=data.questions.map(q=>`<section class="issue-section" id="${q.id}"><span class="eyebrow">${q.id}</span><h2>${esc(q[lang])}</h2><p class="issue-introduction">${esc(q.help.overview[lang])}</p><h3>${esc(t.challenges)}</h3><ul class="open-questions">${q.help.discussion[lang].map(s=>`<li>${esc(s)}</li>`).join('')}</ul><h3>${esc(t.approaches)}</h3><ul class="approach-list">${q.options.map(o=>`<li>${esc(o[lang])}</li>`).join('')}</ul><h3>${esc(t.reading)}</h3><div class="reading-links">${q.help.links.map(l=>`<a href="${esc(l.url)}" target="_blank" rel="noopener noreferrer">${esc(l.title[lang])} <bdi>[${l.language.toUpperCase()}]</bdi> ↗</a>`).join('')}</div></section>`).join('');
    document.getElementById('topic-jump').onchange=e=>{if(e.target.value){location.hash=e.target.value;document.getElementById(e.target.value)?.scrollIntoView();}};
  }
  document.getElementById('language').onchange=e=>{
    lang=e.target.value;render();
    try{history.replaceState(null,'',`?lang=${lang}${location.hash}`);}catch{}
    if(location.hash)document.getElementById(location.hash.slice(1))?.scrollIntoView();
  };
  render();
  if(location.hash) requestAnimationFrame(()=>document.getElementById(location.hash.slice(1))?.scrollIntoView());
})();
</script>
</body></html>

ינה פלסטינית נפרדת.", "profile": {"statehood": "no", "framework": "autonomy"}, "ru": "Сохранить израильский контроль в сфере безопасности и палестинскую гражданскую автономию без отдельного палестинского государства."}, {"id": "interim", "en": "Defer the final-status decision and pursue practical interim agreements on security, movement and economic life.", "he": "לדחות את ההכרעה על הסדר הקבע ולקדם הסכמי ביניים בנושאי ביטחון, תנועה וכלכלה.", "profile": {"statehood": "defer", "framework": "interim"}, "ru": "Отложить решение об окончательном статусе и заключать промежуточные соглашения по безопасности, передвижению и экономике."}, {"id": "shared", "en": "Work toward one democratic state with equal citizenship for Israelis and Palestinians, rather than two states.", "he": "לפעול למדינה דמוקרטית אחת עם אזרחות שווה לישראלים ולפלסטינים, במקום שתי מדינות.", "profile": {"statehood": "no", "framework": "shared"}, "ru": "Стремиться к одному демократическому государству с равным гражданством для израильтян и палестинцев вместо двух государств."}], "note": "Choose the policy package closest to your view. Each package has two separately scored components; choosing a package does not establish views beyond its wording.", "note_he": "בחרו את חבילת המדיניות הקרובה ביותר לעמדתכם. בכל חלופה שני מרכיבים שמושווים בנפרד; הבחירה אינה מעידה על עמדות מעבר למה שנכתב.", "ru": "Какой политический подход Израилю следует выбрать в отношениях с палестинцами?", "note_ru": "Выберите пакет политики, наиболее близкий к вашей позиции. Его два компонента сравниваются отдельно; выбор не означает согласия с положениями, которые здесь не указаны.", "help": {"overview": {"en": "The dispute concerns sovereignty, security and political rights. Two-state, autonomy and shared-state proposals allocate these differently. Interim arrangements defer the final decision; a regional agreement adds neighboring states and guarantees.", "he": "המחלוקת עוסקת בריבונות, בביטחון ובזכויות פוליטיות. שתי מדינות, אוטונומיה ומדינה משותפת מחלקות אותם אחרת. הסדר ביניים דוחה הכרעה סופית; הסדר אזורי מוסיף מדינות שכנות וערבויות.", "ru": "Спор касается суверенитета, безопасности и политических прав. Два государства, автономия и общее государство распределяют их по-разному. Временные договорённости откладывают окончательное решение, а региональное соглашение привлекает соседние страны и гарантии."}, "links": [{"url": "https://www.inss.org.il/publication/the-day-after/", "title": {"en": "INSS: Regional proposals for post-war Gaza", "he": "INSS: מתווים אזוריים לעזה לאחר המלחמה", "ru": "INSS: региональные варианты послевоенного устройства Газы"}, "kind": "analysis", "language": "en"}, {"url": "https://www.altajamoa.org/نصوص-مؤسسة/2017/03/29/البرنامج-السياسي", "title": {"en": "Balad: political program (2017)", "he": "בל״ד: תוכנית פוליטית (2017)", "ru": "БАЛАД: политическая программа (2017)"}, "kind": "party", "language": "ar"}], "discussion": {"en": ["What security guarantees could actually be enforced, and by whom?", "What citizenship and political rights would people have under each proposed arrangement?"], "he": ["אילו ערבויות ביטחוניות אפשר לאכוף בפועל, ועל ידי מי?", "אילו זכויות אזרחיות ופוליטיות יהיו לתושבים בכל הסדר מוצע?"], "ru": ["Какие гарантии безопасности реально исполнимы и кто их обеспечит?", "Какие гражданские и политические права получат жители при каждом устройстве?"]}}}, {"id": "Q2", "short": true, "domain": "security", "en": "How should military and civilian service be organized, including for yeshiva students?", "he": "כיצד יש להסדיר שירות צבאי ואזרחי, כולל לתלמידי ישיבות?", "dimensions": [{"id": "obligation", "en": "Who is obliged to serve?", "he": "על מי חלה החובה?", "weight": 1, "values": [{"id": "universal", "en": "Universal obligation with narrow individual exceptions", "he": "חובה כללית עם חריגים אישיים מצומצמים", "ru": "Всеобщая обязанность с узкими индивидуальными исключениями"}, {"id": "sector_exemption", "en": "Exemption for full-time yeshiva study", "he": "פטור ללימוד d the judiciary?", "he": "כיצד יש לחלק את הכוח בין הכנסת למערכת המשפט?", "dimensions": [{"id": "ordinary_override", "en": "Override by an ordinary coalition majority", "he": "התגברות ברוב קואליציוני רגיל", "weight": 1, "values": [{"id": "yes", "en": "Yes", "he": "כן", "ru": "Да"}, {"id": "no", "en": "No", "he": "לא", "ru": "Нет"}], "ru": "Преодоление судебного решения обычным коалиционным большинством", "similarity": {"matrix": {"yes": {"yes": 1, "no": 0}, "no": {"yes": 0, "no": 1}}, "rationale": {"en": "These are opposed answers to this explicit policy commitment; shared aspects are scored in the other component.", "he": "אלה תשובות מנוגדות להתחייבות המדיניות המפורשת; היבטים משותפים נבחנים במרכיב האחר.", "ru": "Это противоположные ответы на конкретный вопрос политики; общие аспекты учитываются другим компонентом."}}}, {"id": "appointments", "en": "Who selects judges?", "he": "מי בוחר שופטים?", "weight": 1, "values": [{"id": "professional", "en": "Professional committee", "he": "ועדה מקצועית", "ru": "Профессиональная комиссия"}, {"id": "shared", "en": "Government–opposition agreement", "he": "הסכמה בין קואליציה לאופוזיציה", "ru": "Соглашение коалиции и оппозиции"}, {"id": "parliament", "en": "Parliamentary majority", "he": "רוב בכנסת", "ru": "Парламентское большинство"}, {"id": "direct", "en": "Direct public election", "he": "בחירה ישירה בציבור", "ru": "Прямые выборы гражданами"}], "ru": "Кто выбирает судей?", "similarity": {"matrix": {"professional": {"professional": 1, "shared": 0.75, "parliament": 0.25, "direct": 0}, "shared": {"professional": 0.75, "shared": 1, "parliament": 0.5, "direct": 0.25}, "parliament": {"professional": 0.25, "shared": 0.5, "parliament": 1, "direct": 0.5}, "direct": {"professional": 0, "shared": 0.25, "parliament": 0.5, "direct": 1}}, "rationale": {"en": "Credit reflects shared professional checks or electoral accountability, not the identity of a party supporting a model.", "he": "החפיפה מבוססת על בקרה מקצועית או אחריות לנבחרים, ולא על המפלגה התומכת במודל.", "ru": "Сходство отражает общие профессиональные сдержки или выборную подотчётность, а не партийную принадлежность."}}}], "options": [{"id": "professional_review", "en": "Keep rights-based judicial review without an ordinary-majority override; use a professionally led judicial appointments committee.", "he": "לשמור על ביקורת שיפוטית להגנת זכויות ללא התגברות ברוב רגיל; למנות שופטים בוועדה בהובלה מקצועית.", "profile": {"ordinary_override": "no", "appointments": "professional"}, "ru": "Сохранить судебный контроль для защиты прав без возможности преодолеть его обычным большинством; назначать судей через комиссию под руководством профессионалов."}, {"id": "shared_review", "en": "Require government–opposition agreement on judicial appointments, and prohibit overriding rights judgments by an ordinary coalition majority.", "he": "לחייב הסכמה בין קואליציה לאופוזיציה במינוי שופטים, ולא לאפשר לרוב קואליציוני רגיל להתגבר על פסיקות המגינות על זכויות.", "profile": {"ordinary_override": "no", "appointments": "shared"}, "ru": "Назначать судей по соглашению коалиции и оппозиции и не позволять обычному коалиционному большинству преодолевать решения о защите прав."}, {"id": "parliamentary", "en": "Let an ordinary Knesset majority override invalidation of a law and give elected legislators control over judicial appointments.", "he": "לאפשר לרוב רגיל בכנסת להתגבר על פסילת חוק ולהעניק לנבחרי הציבור שליטה במינוי שופטים.", "profile": {"ordinary_override": "yes", "appointments": "parliament"}, "ru": "Разрешить обычному большинству Кнессета преодолевать отмену закона судом и передать избранным депутатам контроль над назначением судей."}, {"id": "direct_election", "en": "Allow an ordinary-majority override, but have the public elect senior judges directly for fixed terms.", "he": "לאפשר התגברות ברוב רגיל, אך לבחור שופטים בכירים בבחירה ישירה של הציבור לתקופות קצובות.", "profile": {"ordinary_override": "yes", "appointments": "direct"}, "ru": "Разрешить преодоление обычным большинством, но избирать высших судей прямым голосованием граждан на фиксированный срок."}], "note": "Choose the policy package closest to your view. Each package has two separately scored components; choosing a package does not establish views beyond its wording.", "note_he": "בחרו את חבילת המדיניות הקרובה ביותר לעמדתכם. בכל חלופה שני מרכיבים שמושווים בנפרד; הבחירה אינה מעידה על עמדות מעבר למה שנכתב.", "ru": "Как распределить полномочия между Кнессетом и судебной системой?", "note_ru": "Выберите пакет политики, наиболее близкий к вашей позиции. Его два компонента сравниваются отдельно; выбор не означает согласия с положениями, которые здесь не указаны.", "help": {"overview": {"en": "An override clause would let the Knesset re-enact a law invalidated for conflicting with constitutional rights. Supporters emphasize elected lawmakers' authority; critics emphasize minority-rights safeguards. The required majority, duration and judicial appointment system affect the balance.", "he": "פסקת התגברות נועדה לאפשר לכנסת לחוקק מחדש חוק שנפסל בשל סתירה לזכויות חוקתיות. תומכים מדגישים את סמכות הנבחרים; מתנגדים מדגישים הגנה על זכויות מיעוט. הרוב הדרוש, משך ההתגברות ושיטת מינוי השופטים משפיעים על האיזון.", "ru": "Положение о преодолении судебного вето позволило бы Кнессету вновь принять закон, отменённый судом из-за нарушения конституционных прав. Сторонники подчёркивают полномочия избранных законодателей, критики — защиту меньшинств. Баланс зависит от требуемого большинства, срока действия и порядка назначения судей."}, "links": [{"url": "https://en.idi.org.il/articles/46387", "title": {"en": "IDI: The override clause explained", "he": "IDI: הסבר על פסקת ההתגברות", "ru": "IDI: что такое преодоление судебного вето"}, "kind": "analysis", "language": "en"}, {"url": "https://zionutdatit.org.il/wp-content/uploads/2021/12/משפט.pdf", "title": {"en": "Religious Zionism: judicial proposals (2021)", "he": "הציונות הדתית: הצעות בתחום המשפט (2021)", "ru": "Религиозный сионизм: судебные предложения (2021)"}, "kind": "party", "language": "he"}], "discussion": {"en": ["Which decisions should an elected majority be unable to make without broader agreement?", "How can judges be accountable without making their decisions dependent on electoral pressure?"], "he": ["אילו החלטות רוב נבחר לא צריך להיות רשאי לקבל בלי הסכמה רחבה יותר?", "כיצד יוצרים אחריות של שופטים בלי להכפיף את פסיקותיהם ללחץ אלקטורלי?"], "ru": ["Какие решения избранное большинство не должно принимать без более широкого согласия?", "Как обеспечить подотчётность судей без зависимости решений от избирательного давления?"]}}}, {"id": "Q4", "short": true, "domain": "institutions", "en": "How should equality and the state's national identity be expressed in constitutional law?", "he": "כיצד יש לבטא את השוויון ואת הזהות הלאומית של המדינה בחוקי היסוד?", "dimensions": [{"id": "equality", "en": "Legal protection for equal civil rights", "he": "עיגון שוויון הזכויות האזרחיות", "weight": 1, "values": [{"id": "constitutional", "en": "Explicit constitutional guarantee", "he": "עיגון מפורש בחוק יסוד", "ru": "Прямая конституционная гарантия"}, {"id": "ordinary", "en": "Ordinary legislation", "he": "חקיקה רגילה", "ru": "Обычное законодательство"}, {"id": "existing", "en": "Retain existing protections", "he": "להשאיר את ההגנות הקיימות", "ru": "Сохранение существующей защиты"}], "ru": "Правовая защита равных гражданских прав", "similarity": {"matrix": {"constitutional": {"constitutional": 1, "ordinary": 0.5, "existing": 0.25}, "ordinary": {"constitutional": 0.5, "ordinary": 1, "existing": 0.5}, "existing": {"constitutional": 0.25, "ordinary": 0.5, "existing": 1}}, "rationale": {"en": "All refer to rights protection but differ in explicitness and legal entrenchment.", "he": "האפשרויות עוסקות בהגנת זכויות אך שונות במפורשות ובעוצמת העיגון המשפטי.", "ru": "Все варианты касаются защиты прав, но различаются её прямотой и уровнем правового закрепления."}}}, {"id": "identity", "en": "National identity", "he": "זהות לאומית", "weight": 1, "values": [{"id": "jewish_democratic", "en": "Jewish and democratic", "he": "יהודית ודמוקרטית", "ru": "Еврейское и демократическое государство"}, {"id": "civic", "en": "Civic state of all citizens", "he": "מדינה אזרחית של כלל אזרחיה", "ru": "Гражданское государство всех граждан"}, {"id": "binational", "en": "Recognition of two national collectives", "he": "הכרה בשני קולקטיבים לאומיים", "ru": "Признание двух национальных общностей"}], "ru": "Национальный характер", "similarity": {"matrix": {"jewish_democratic": {"jewish_democratic": 1, "civic": 0.25, "binational": 0.25}, "civic": {"jewish_democratic": 0.25, "civic": 1, "binational": 0.75}, "binational": {"jewish_democratic": 0.25, "civic": 0.75, "binational": 1}}, "rationale": {"en": "Civic and binational models overlap in equal belonging; national definitions remain a substantive distinction.", "he": "למודל אזרחי ולמודל דו־לאומי חפיפה בשייכות שווה; ההגדרה הלאומית היא הבדל מהותי.", "ru": "Гражданская и двунациональная модели близки по равной принадлежности; национальное определение остаётся существенным различием."}}}], "options": [{"id": "jewish_equal", "en": "Guarantee equal individual civil rights in a Basic Law while retaining Israel's identity as a Jewish and democratic state.", "he": "לעגן בחוק יסוד שוויון זכויות אזרחיות אישיות, לצד זהותה של ישראל כמדינה יהודית ודמוקרטית.", "profile": {"equality": "constitutional", "identity": "jewish_democratic"}, "ru": "Закрепить равные личные гражданские права в Основном законе, сохранив характер Израиля как еврейского и демократического государства."}, {"id": "civic_equal", "en": "Guarantee constitutional equality and define the state in civic terms as belonging equally to all its citizens.", "he": "לעגן שוויון חוקתי ולהגדיר את המדינה במונחים אזרחיים כשייכת באופן שווה לכל אזרחיה.", "profile": {"equality": "constitutional", "identity": "civic"}, "ru": "Гарантировать конституционное равенство и определить государство как гражданское, в равной мере принадлежащее всем его гражданам."}, {"id": "collective_equal", "en": "Guarantee equal individual rights and recognize both Jewish and Arab national collectives in the constitutional framework.", "he": "לעגן שוויון זכויות אישיות ולהכיר במסגרת החוקתית הן בקולקטיב הלאומי היהודי והן בקולקטיב הלאומי הערבי.", "profile": {"equality": "constitutional", "identity": "binational"}, "ru": "Гарантировать равные личные права и признать в конституционном устройстве как еврейскую, так и арабскую национальную общность."}, {"id": "ordinary_equal", "en": "Retain the Jewish and democratic constitutional definition, and protect equality through ordinary legislation.", "he": "להשאיר את ההגדרה החוקתית היהודית והדמוקרטית ולהגן על השוויון בחקיקה רגילה.", "profile": {"equality": "ordinary", "identity": "jewish_democratic"}, "ru": "Сохранить конституционное определение еврейского и демократического государства, защищая равноправие обычными законами."}, {"id": "existing", "en": "Keep the Jewish and democratic definition and existing rights protections, without adding a new equality guarantee.", "he": "להשאיר את ההגדרה היהודית והדמוקרטית ואת הגנות הזכויות הקיימות, ללא עיגון חדש של השוויון.", "profile": {"equality": "existing", "identity": "jewish_democratic"}, "ru": "Сохранить определение еврейского и демократического государства и действующие гарантии прав, не добавляя новой гарантии равенства."}], "note": "Choose the policy package closest to your view. Each package has two separately scored components; choosing a package does not establish views beyond its wording.", "note_he": "בחרו את חבילת המדיניות הקרובה ביותר לעמדתכם. בכל חלופה שני מרכיבים שמושווים בנפרד; הבחירה אינה מעידה על עמדות מעבר למה שנכתב.", "ru": "Как закрепить равноправие и национальный характер государства в Основных законах?", "note_ru": "Выберите пакет политики, наиболее близкий к вашей позиции. Его два компонента сравниваются отдельно; выбор не означает согласия с положениями, которые здесь не указаны.", "help": {"overview": {"en": "Equal individual citizenship and a state's national identity are related but distinct. The dispute asks both how strongly equality should be legally protected and whether national belonging is defined as Jewish, civic or shared by two national communities.", "he": "שוויון אזרחי אישי וזהותה הלאומית של מדינה קשורים אך אינם זהים. המחלוקת עוסקת בעוצמת העיגון המשפטי של השוויון ובשאלה אם השייכות הלאומית מוגדרת כיהודית, אזרחית או משותפת לשתי קהילות לאומיות.", "ru": "Равное личное гражданство и национальный характер государства связаны, но не тождественны. Спор касается силы правовой защиты равенства и определения принадлежности: еврейской, гражданской или общей для двух национальных сообществ."}, "links": [{"url": "https://en.idi.org.il/articles/24241", "title": {"en": "IDI: Nation-State Law explainer", "he": "IDI: הסבר על חוק הלאום", "ru": "IDI: разбор Закона о национальном государстве"}, "kind": "analysis", "language": "en"}, {"url": "https://www.altajamoa.org/نصوص-مؤسسة/2017/03/29/البرنامج-السياسي", "title": {"en": "Balad: political program (2017)", "he": "בל״ד: תוכנית פוליטית (2017)", "ru": "БАЛАД: политическая программа (2017)"}, "kind": "party", "language": "ar"}], "discussion": {"en": ["When do equal individual rights require recognition of collective language or cultural rights?", "How should conflicts between national symbols, public resources and equal belonging be resolved?"], "he": ["מתי שוויון זכויות אישי מחייב הכרה בזכויות לשוניות או תרבותיות קיבוציות?", "כיצד פותרים התנגשות בין סמלים לאומיים, משאבים ציבוריים ושייכות שווה?"], "ru": ["Когда равные личные права требуют признания коллективных языковых или культурных прав?", "Как разрешать конфликты между национальными символами, ресурсами и равной принадлежностью?"]}}}, {"id": "Q5", "short": true, "domain": "religion", "en": "What routes should couples have for marriage, partnership and separation?", "he": "אילו מסלולים יש להציע לזוגות לנישואים, לזוגיות ולפרידה?", "dimensions": [{"id": "civil_route", "en": "Civil legal route", "he": "המסלול האזרחי", "weight": 1, "values": [{"id": "marriage", "en": "Civil marriage and divorce for all", "he": "נישואים וגירושים אזרחיים לכולם", "ru": "Гражданский брак и развод для всех"}, {"id": "registration", "en": "Civil partnership registration", "he": "רישום זוגיות אזרחית", "ru": "Регистрация гражданского партнёрства"}, {"id": "none", "en": "No domestic civil route", "he": "ללא מסלול אזרחי בישראל", "ru": "Без гражданского порядка внутри Израиля"}], "ru": "Гражданский правовой порядок", "similarity": {"matrix": {"marriage": {"marriage": 1, "registration": 0.75, "none": 0}, "registration": {"marriage": 0.75, "registration": 1, "none": 0.25}, "none": {"marriage": 0, "registration": 0.25, "none": 1}}, "rationale": {"en": "Civil registration shares legal protection outside religious marriage, but is not assumed legally equivalent to marriage and divorce.", "he": "רישום אזרחי מעניק הגנות מחוץ לנישואים דתיים, אך אינו נחשב זהה משפטית לנישואים ולגירושים.", "ru": "Гражданская регистрация даёт защиту вне религиозного брака, но не считается юридически равной браку и разводу."}}}, {"id": "religious_role", "en": "Role of religious institutions", "he": "תפקיד המוסדות הדתיים", "weight": 1, "values": [{"id": "optional", "en": "Optional legally recognized religious route", "he": "מסלול דתי מוכר לפי בחירה", "ru": "Религиозный порядок по выбору с юридическим признанием"}, {"id": "private", "en": "Religious ceremonies are private", "he": "טקסים דתיים הם עניין פרטי", "ru": "Религиозные церемонии — частное дело"}, {"id": "exclusive", "en": "Religious institutions have exclusive jurisdiction", "he": "סמכות בלעדית למוסדות הדת", "ru": "Исключительная компетенция религиозных учреждений"}], "ru": "Роль религиозных учреждений", "similarity": {"matrix": {"optional": {"optional": 1, "private": 0.5, "exclusive": 0.25}, "private": {"optional": 0.5, "private": 1, "exclusive": 0}, "exclusive": {"optional": 0.25, "private": 0, "exclusive": 1}}, "rationale": {"en": "Optional and private routes share freedom of choice; optional and exclusive routes retain some formal religious role.", "he": "מסלול לבחירה וטקס פרטי חולקים חופש בחירה; מסלול לבחירה וסמכות בלעדית משמרים תפקיד דתי רשמי כלשהו.", "ru": "Добровольный и частный пути разделяют свободу выбора; добровольный и исключительный сохраняют некоторую официальную роль религии."}}}], "options": [{"id": "parallel", "en": "Offer civil marriage and divorce alongside an optional, legally recognized religious route.", "he": "להציע נישואים וגירושים אזרחיים לצד מסלול דתי מוכר לבחירת הזוג.", "profile": {"civil_route": "marriage", "religious_role": "optional"}, "ru": "Предоставить гражданский брак и развод наряду с добровольно выбираемым, юридически признанным религиозным порядком."}, {"id": "civil_only", "en": "Use civil marriage and divorce for everyone legally; religious ceremonies remain a private choice.", "he": "להסדיר את הנישואים והגירושים של כולם במערכת אזרחית; טקס דתי יישאר בחירה פרטית.", "profile": {"civil_route": "marriage", "religious_role": "private"}, "ru": "Юридически оформлять все браки и разводы в гражданской системе, оставив религиозные церемонии личным выбором."}, {"id": "registration", "en": "Add civil partnership registration with legal protections, while retaining religious marriage as a separate recognized route.", "he": "להוסיף רישום זוגיות אזרחית עם הגנות משפטיות, לצד נישואים דתיים כמסלול מוכר נפרד.", "profile": {"civil_route": "registration", "religious_role": "optional"}, "ru": "Добавить регистрацию гражданского партнёрства с правовой защитой, сохранив религиозный брак как отдельный признанный путь."}, {"id": "religious", "en": "Keep marriage and divorce under the religious institutions, without adding a domestic civil route.", "he": "להשאיר את הנישואים והגירושים בסמכות מוסדות הדת, ללא הוספת מסלול אזרחי בישראל.", "profile": {"civil_route": "none", "religious_role": "exclusive"}, "ru": "Оставить брак и развод в ведении религиозных учреждений, не вводя гражданского порядка внутри Израиля."}], "note": "Choose the policy package closest to your view. Each package has two separately scored components; choosing a package does not establish views beyond its wording.", "note_he": "בחרו את חבילת המדיניות הקרובה ביותר לעמדתכם. בכל חלופה שני מרכיבים שמושווים בנפרד; הבחירה אינה מעידה על עמדות מעבר למה שנכתב.", "ru": "Какие правовые пути должны быть доступны парам для брака, партнёрства и расставания?", "note_ru": "Выберите пакет политики, наиболее близкий к вашей позиции. Его два компонента сравниваются отдельно; выбор не означает согласия с положениями, которые здесь не указаны.", "help": {"overview": {"en": "Marriage, civil partnership and religious ceremonies need not have identical legal effects. The debate combines freedom to form a family with religious institutions' role, including who handles separation. A civil registry is not automatically equivalent to civil marriage.", "he": "לנישואים, לרישום זוגיות ולטקס דתי אין בהכרח אותן תוצאות משפטיות. הדיון משלב חופש להקים משפחה עם תפקיד מוסדות הדת, כולל סמכות בענייני פרידה. רישום אזרחי אינו בהכרח זהה לנישואים אזרחיים.", "ru": "Брак, гражданское партнёрство и религиозная церемония не обязательно имеют одинаковые правовые последствия. Спор соединяет свободу создания семьи с ролью религиозных учреждений, включая расставание. Регистрация не автоматически равна гражданскому браку."}, "links": [{"url": "https://en.idi.org.il/articles/6539", "title": {"en": "IDI: Civil unions for all", "he": "IDI: ברית זוגיות לכולם", "ru": "IDI: гражданские союзы для всех"}, "kind": "analysis", "language": "en"}, {"url": "https://zionutdatit.org.il/wp-content/uploads/2021/12/זהות-יהודית.pdf", "title": {"en": "Religious Zionism: Jewish identity (2021)", "he": "הציונות הדתית: זהות יהודית (2021)", "ru": "Религиозный сионизм: еврейский характер (2021)"}, "kind": "party", "language": "he"}], "discussion": {"en": ["Would the available routes provide genuinely comparable rights, including when a relationship ends?", "How should the state handle a disagreement between partners over religious and civil jurisdiction?"], "he": ["האם המסלולים יספקו זכויות מקבילות בפועל, גם כשהקשר מסתיים?", "כיצד המדינה תטפל במחלוקת בין בני זוג על סמכות דתית או אזרחית?"], "ru": ["Дадут ли разные пути сопоставимые права, в том числе при расставании?", "Как государству решать разногласия партнёров о религиозной и гражданской юрисдикции?"]}}}, {"id": "Q6", "short": true, "domain": "religion", "en": "Who should decide on Shabbat transport, and what service should be available?", "he": "מי צריך להחליט על תחבורה בשבת, ואיזה שירות צריך להיות זמין?", "dimensions": [{"id": "service", "en": "Public transport on Shabbat", "he": "תחבורה ציבורית בשבת", "weight": 1, "values": [{"id": "limited", "en": "Limited public service", "he": "שירות ציבורי מצומצם", "ru": "Ограниченное общественное сообщение"}, {"id": "full", "en": "Regular public network", "he": "רשת ציבורית רגילה", "ru": "Обычная общественная сеть"}, {"id": "none", "en": "No public service", "he": "ללא שירות ציבורי", "ru": "Без общественного сообщения"}], "ru": "Общественный транспорт в шаббат", "similarity": {"matrix": {"limited": {"limited": 1, "full": 0.75, "none": 0.25}, "full": {"limited": 0.75, "full": 1, "none": 0}, "none": {"limited": 0.25, "full": 0, "none": 1}}, "rationale": {"en": "Limited and regular service both provide public mobility; limited service retains more rest-day restrictions.", "he": "שירות מצומצם ורגיל מספקים ניידות ציבורית; שירות מצומצם משמר יותר מגבלות של יום מנוחה.", "ru": "Ограниченное и обычное сообщение обеспечивают общественную мобильность; ограниченное сохраняет больше ограничений дня отдыха."}}}, {"id": "authority", "en": "Decision-making level", "he": "מי מחליט?", "weight": 1, "values": [{"id": "local", "en": "Municipalities", "he": "רשויות מקומיות", "ru": "Муниципалитеты"}, {"id": "national", "en": "National government", "he": "הממשלה", "ru": "Центральное правительство"}], "ru": "Уровень принятия решений", "similarity": {"matrix": {"local": {"local": 1, "national": 0}, "national": {"local": 0, "national": 1}}, "rationale": {"en": "Local discretion and a uniform national decision are different allocations of authority.", "he": "שיקול דעת מקומי והכרעה ארצית אחידה הם חלוקות סמכות שונות.", "ru": "Местное усмотрение и единое общенациональное решение по-разному распределяют полномочия."}}}], "options": [{"id": "local_limited", "en": "Let municipalities run limited routes suited to local needs and avoid routes through religious neighborhoods.", "he": "לאפשר לרשויות להפעיל קווים מצומצמים לפי הצורך המקומי, תוך הימנעות ממעבר בשכונות דתיות.", "profile": {"service": "limited", "authority": "local"}, "ru": "Разрешить муниципалитетам организовывать ограниченные маршруты по местным потребностям, избегая проезда через религиозные кварталы."}, {"id": "national_limited", "en": "Set a national limited network connecting hospitals, employment centers and major towns, with uniform rules.", "he": "לקבוע רשת ארצית מצומצמת המחברת בתי חולים, מוקדי תעסוקה ויישובים מרכזיים, לפי כללים אחידים.", "profile": {"service": "limited", "authority": "national"}, "ru": "Создать ограниченную общенациональную сеть между больницами, центрами занятости и крупными населёнными пунктами по единым правилам."}, {"id": "national_regular", "en": "Operate a regular national public transport network on Shabbat, with service frequency adjusted to demand.", "he": "להפעיל בשבת רשת תחבורה ציבורית ארצית רגילה, בתדירות המותאמת לביקוש.", "profile": {"service": "full", "authority": "national"}, "ru": "Обеспечить обычную общенациональную сеть общественного транспорта в шаббат, регулируя частоту по спросу."}, {"id": "private_local", "en": "Keep public transport closed, but let municipalities authorize privately funded shared transport.", "he": "להשאיר את התחבורה הציבורית סגורה, אך לאפשר לרשויות להתיר תחבורה שיתופית במימון פרטי.", "profile": {"service": "none", "authority": "local"}, "ru": "Не запускать общественный транспорт, но разрешить муниципалитетам одобрять совместные перевозки с частным финансированием."}, {"id": "national_rest", "en": "Maintain a national rest-day policy without public transport; keep exceptions under national rules.", "he": "לקיים מדיניות יום מנוחה ארצית ללא תחבורה ציבורית, עם חריגים לפי כללים ארציים.", "profile": {"service": "none", "authority": "national"}, "ru": "Сохранить общенациональный день отдыха без общественного транспорта, с исключениями по государственным правилам."}], "note": "Choose the policy package closest to your view. Each package has two separately scored components; choosing a package does not establish views beyond its wording.", "note_he": "בחרו את חבילת המדיניות הקרובה ביותר לעמדתכם. בכל חלופה שני מרכיבים שמושווים בנפרד; הבחירה אינה מעידה על עמדות מעבר למה שנכתב.", "ru": "Кто должен решать вопрос о транспорте в шаббат и какое сообщение должно быть доступно?", "note_ru": "Выберите пакет политики, наиболее близкий к вашей позиции. Его два компонента сравниваются отдельно; выбор не означает согласия с положениями, которые здесь не указаны.", "help": {"overview": {"en": "Shabbat transport involves mobility for people without cars, a shared day of rest, workers' conditions and neighborhood character. Separate choices concern the extent of service and whether national or local authorities decide.", "he": "תחבורה בשבת נוגעת לניידות של מי שאין להם רכב, ליום מנוחה משותף, לתנאי עובדים ולאופי השכונות. שתי הכרעות נפרדות הן היקף השירות וזהות הגורם המחליט — הממשלה או הרשות המקומית.", "ru": "Транспорт в шаббат затрагивает мобильность людей без автомобиля, общий день отдыха, условия работников и характер районов. Отдельные решения касаются объёма сообщения и того, кто решает — государство или муниципалитет."}, "links": [{"url": "https://en.idi.org.il/articles/5269", "title": {"en": "IDI: Transport on Shabbat and religion–state tensions", "he": "IDI: תחבורה בשבת ומחלוקת דת ומדינה", "ru": "IDI: транспорт в шаббат и отношения религии и государства"}, "kind": "analysis", "language": "en"}, {"url": "https://zionutdatit.org.il/wp-content/uploads/2021/12/זהות-יהודית.pdf", "title": {"en": "Religious Zionism: Jewish identity (2021)", "he": "הציונות הדתית: זהות יהודית (2021)", "ru": "Религиозный сионизм: еврейский характер (2021)"}, "kind": "party", "language": "he"}], "discussion": {"en": ["Who pays for the service, and how are workers who want a shared rest day protected?", "How can one municipality's decision avoid imposing costs or traffic on its neighbors?"], "he": ["מי מממן את השירות, וכיצד מגינים על עובדים המעוניינים ביום מנוחה משותף?", "כיצד מונעים מהחלטה ברשות אחת להטיל עלויות או תנועה על שכנותיה?"], "ru": ["Кто оплачивает сообщение и как защитить работников, желающих общего дня отдыха?", "Как избежать переноса расходов и трафика из одного муниципалитета в соседние?"]}}}, {"id": "Q7", "short": true, "domain": "economy", "en": "What fiscal approach should guide healthcare, education and welfare?", "he": "איזו מדיניות תקציבית צריכה להנחות את הבריאות, החינוך והרווחה?", "dimensions": [{"id": "services", "en": "Scale of publicly funded services", "he": "היקף השירותים במימון ציבורי", "weight": 1, "values": [{"id": "expand", "en": "Expand", "he": "להרחיב", "ru": "Расширить"}, {"id": "maintain", "en": "Maintain", "he": "לשמר", "ru": "Сохранить"}, {"id": "reduce", "en": "Reduce state provision", "he": "לצמצם את השירות המדינתי", "ru": "Сократить государственное предоставление"}], "ru": "Объём услуг с государственным финансированием", "similarity": {"matrix": {"expand": {"expand": 1, "maintain": 0.5, "reduce": 0}, "maintain": {"expand": 0.5, "maintain": 1, "reduce": 0.5}, "reduce": {"expand": 0, "maintain": 0.5, "reduce": 1}}, "rationale": {"en": "Maintaining scale is intermediate between expanding and reducing it.", "he": "שימור ההיקף הוא מצב ביניים בין הרחבה לצמצום.", "ru": "Сохранение объёма занимает промежуточное положение между расширением и сокращением."}}}, {"id": "funding", "en": "Main funding approach", "he": "דרך המימון העיקרית", "weight": 1, "values": [{"id": "progressive", "en": "Higher taxes on high incomes and wealth", "he": "הגדלת מסים על הכנסות גבוהות והון", "ru": "Повысить налоги на высокие доходы и капитал"}, {"id": "broad", "en": "Broader tax increases", "he": "העלאת מסים רחבה", "ru": "Повысить налоги для более широкого круга плательщиков"}, {"id": "reprioritize", "en": "Reallocate existing spending", "he": "שינוי סדרי עדיפויות בתקציב", "ru": "Перераспределить существующие расходы"}, {"id": "lower_taxes", "en": "Lower taxes and private provision", "he": "הפחתת מסים ומענה פרטי", "ru": "Снизить налоги и расширить частное предоставление"}], "ru": "Основной подход к финансированию", "similarity": {"matrix": {"progressive": {"progressive": 1, "broad": 0.5, "reprioritize": 0.25, "lower_taxes": 0}, "broad": {"progressive": 0.5, "broad": 1, "reprioritize": 0.25, "lower_taxes": 0}, "reprioritize": {"progressive": 0.25, "broad": 0.25, "reprioritize": 1, "lower_taxes": 0.25}, "lower_taxes": {"progressive": 0, "broad": 0, "reprioritize": 0.25, "lower_taxes": 1}}, "rationale": {"en": "Tax increases overlap as revenue tools; reallocations have limited overlap with either tax-based expansion or tax reduction.", "he": "העלאות מס חופפות ככלי הכנסה; לשינוי סדרי עדיפויות חפיפה מוגבלת עם הרחבה במיסוי או עם הפחתת מס.", "ru": "Повышения налогов близки как источник доходов; перераспределение лишь частично сходно с расширением за счёт налогов или их снижением."}}}], "options": [{"id": "progressive_expansion", "en": "Expand public services, financed mainly by higher taxes on high incomes and wealth.", "he": "להרחיב שירותים ציבוריים, בעיקר באמצעות הגדלת המס על הכנסות גבוהות ועל הון.", "profile": {"services": "expand", "funding": "progressive"}, "ru": "Расширять государственно финансируемые услуги, главным образом за счёт повышения налогов на высокие доходы и капитал."}, {"id": "broad_expansion", "en": "Expand universal services and finance them through broader tax increases shared across the population.", "he": "להרחיב שירותים אוניברסליים ולממן אותם בהעלאות מס רחבות המתחלקות על פני האוכלוסייה.", "profile": {"services": "expand", "funding": "broad"}, "ru": "Расширять всеобщие услуги и финансировать их более широким повышением налогов для населения."}, {"id": "reallocate", "en": "Expand services by cutting other spending and improving efficiency, without planning a tax increase.", "he": "להרחיב שירותים באמצעות קיצוץ הוצאות אחרות והתייעלות, ללא העלאת מס מתוכננת.", "profile": {"services": "expand", "funding": "reprioritize"}, "ru": "Расширять услуги за счёт сокращения других расходов и повышения эффективности, не планируя повышения налогов."}, {"id": "maintain", "en": "Keep the present scale of public services and concentrate on efficiency and reallocating existing budgets.", "he": "לשמר את היקף השירותים הציבוריים ולהתמקד בהתייעלות ובחלוקה מחדש של התקציבים הקיימים.", "profile": {"services": "maintain", "funding": "reprioritize"}, "ru": "Сохранить нынешний объём общественных услуг, сосредоточившись на эффективности и перераспределении имеющихся бюджетов."}, {"id": "smaller_state", "en": "Reduce taxes and state provision, with a larger role for private insurance, households and community support.", "he": "להפחית מסים ואת היקף השירות המדינתי, ולהרחיב את תפקיד הביטוח הפרטי, משקי הבית והסיוע הקהילתי.", "profile": {"services": "reduce", "funding": "lower_taxes"}, "ru": "Снизить налоги и объём государственных услуг, увеличив роль частного страхования, домохозяйств и общинной поддержки."}], "note": "Choose the policy package closest to your view. Each package has two separately scored components; choosing a package does not establish views beyond its wording.", "note_he": "בחרו את חבילת המדיניות הקרובה ביותר לעמדתכם. בכל חלופה שני מרכיבים שמושווים בנפרד; הבחירה אינה מעידה על עמדות מעבר למה שנכתב.", "ru": "Какой бюджетный подход выбрать для здравоохранения, образования и социальной поддержки?", "note_ru": "Выберите пакет политики, наиболее близкий к вашей позиции. Его два компонента сравниваются отдельно; выбор не означает согласия с положениями, которые здесь не указаны.", "help": {"overview": {"en": "Larger public services require resources. Taxes, spending cuts elsewhere and efficiency measures distribute the costs differently. Favoring better services does not by itself settle who should pay, or whether more provision should be public or private.", "he": "הרחבת שירותים ציבוריים דורשת משאבים. מסים, קיצוץ בסעיפים אחרים והתייעלות מחלקים את העלות אחרת. תמיכה בשירות טוב יותר אינה קובעת לבדה מי ישלם, או אם ההרחבה תהיה ציבורית או פרטית.", "ru": "Расширение общественных услуг требует ресурсов. Налоги, сокращение других расходов и эффективность по-разному распределяют издержки. Желание лучших услуг само по себе не определяет, кто платит и кто их предоставляет."}, "links": [{"url": "https://www.oecd.org/en/publications/oecd-economic-surveys-israel-2025_d6dd02bc-en/full-report/maintaining-macroeconomic-stability_329dd12a.html", "title": {"en": "OECD: Israel's fiscal choices (2025)", "he": "OECD: אפשרויות המדיניות התקציבית בישראל (2025)", "ru": "ОЭСР: бюджетные решения Израиля (2025)"}, "kind": "research", "language": "en"}, {"url": "https://democrats.org.il/wp-content/uploads/2025/09/agenda2025.pdf", "title": {"en": "Democrats: July 2025 agenda", "he": "הדמוקרטים: תוכנית יולי 2025", "ru": "Демократы: программа июля 2025 года"}, "kind": "party", "language": "he"}], "discussion": {"en": ["If expansion relies on efficiency, what happens if the expected savings do not materialize?", "Which households bear the cost, and which services or future investments would otherwise lose funding?"], "he": ["אם ההרחבה נשענת על התייעלות, מה קורה כשהחיסכון הצפוי אינו מתממש?", "אילו משקי בית נושאים בעלות, ואילו שירותים או השקעות עתידיות עלולים לאבד מימון?"], "ru": ["Что делать, если расширение опирается на эффективность, а экономия не возникает?", "Какие семьи несут расходы и какие услуги или будущие инвестиции теряют финансирование?"]}}}, {"id": "Q8", "short": true, "domain": "economy", "en": "Which mix of tools should address the cost of everyday goods?", "he": "באיזה שילוב כלים יש לטפל ביוקר המוצרים היומיומיים?", "dimensions": [{"id": "imports", "en": "Import policy", "he": "מדיניות יבוא", "weight": 1, "values": [{"id": "open", "en": "Broadly reduce import barriers", "he": "צמצום רחב של חסמי יבוא", "ru": "Широкое снижение импортных барьеров"}, {"id": "selective", "en": "Selective opening with strategic protection", "he": "פתיחה סלקטיבית עם הגנה על ענפים אסטרטגיים", "ru": "Выборочное открытие с защитой стратегических отраслей"}, {"id": "protect", "en": "Retain broad import protection", "he": "שימור הגנה רחבה מפני יבוא", "ru": "Сохранение широкой защиты от импорта"}], "ru": "Импортная политика", "similarity": {"matrix": {"open": {"open": 1, "selective": 0.5, "protect": 0}, "selective": {"open": 0.5, "selective": 1, "protect": 0.5}, "protect": {"open": 0, "selective": 0.5, "protect": 1}}, "rationale": {"en": "Selective opening shares liberalization with open trade and protection with the protected model.", "he": "פתיחה סלקטיבית חולקת פתיחת שווקים עם יבוא פתוח והגנה עם המודל המוגן.", "ru": "Выборочное открытие разделяет либерализацию с открытым импортом и защиту с протекционизмом."}}}, {"id": "consumer_tool", "en": "Main consumer policy tool", "he": "כלי המדיניות המרכזי לצרכן", "weight": 1, "values": [{"id": "competition", "en": "Competition and antitrust enforcement", "he": "תחרות ואכיפה נגד ריכוזיות", "ru": "Конкуренция и антимонопольный контроль"}, {"id": "prices", "en": "Price controls", "he": "פיקוח מחירים", "ru": "Регулирование цен"}, {"id": "support", "en": "Targeted household support", "he": "סיוע ממוקד למשקי בית", "ru": "Адресная помощь домохозяйствам"}], "ru": "Основной инструмент поддержки потребителей", "similarity": {"matrix": {"competition": {"competition": 1, "prices": 0, "support": 0.25}, "prices": {"competition": 0, "prices": 1, "support": 0.5}, "support": {"competition": 0.25, "prices": 0.5, "support": 1}}, "rationale": {"en": "Price controls and household support both intervene directly in affordability, but through different mechanisms.", "he": "פיקוח מחירים וסיוע למשקי בית מתערבים ישירות ביכולת הקנייה, אך במנגנונים שונים.", "ru": "Контроль цен и помощь домохозяйствам прямо влияют на доступность товаров, но разными механизмами."}}}], "options": [{"id": "open_competition", "en": "Reduce import barriers broadly and enforce competition rules, while retaining product-safety standards.", "he": "לצמצם חסמי יבוא באופן רחב ולאכוף תחרות, תוך שמירה על תקני בטיחות למוצרים.", "profile": {"imports": "open", "consumer_tool": "competition"}, "ru": "Широко снижать импортные барьеры и обеспечивать конкуренцию, сохраняя стандарты безопасности товаров."}, {"id": "selective_competition", "en": "Open more markets to imports, protect strategic local production, and fight domestic concentration.", "he": "לפתוח שווקים נוספים ליבוא, להגן על ייצור מקומי אסטרטגי ולהיאבק בריכוזיות המקומית.", "profile": {"imports": "selective", "consumer_tool": "competition"}, "ru": "Открывать больше рынков для импорта, защищать стратегически важное местное производство и бороться с концентрацией рынка."}, {"id": "protect_prices", "en": "Retain broad protection for local producers and use price controls on essential goods.", "he": "לשמור על הגנה רחבה ליצרנים מקומיים ולהפעיל פיקוח מחירים על מוצרי יסוד.", "profile": {"imports": "protect", "consumer_tool": "prices"}, "ru": "Сохранить широкую защиту местных производителей и регулировать цены на основные товары."}, {"id": "open_support", "en": "Open imports broadly, but cushion living costs mainly through targeted support for low-income households.", "he": "לפתוח את היבוא באופן רחב, אך להקל על יוקר המחיה בעיקר בסיוע ממוקד למשקי בית מעוטי הכנסה.", "profile": {"imports": "open", "consumer_tool": "support"}, "ru": "Широко открыть импорт, но смягчать дороговизну прежде всего адресной помощью малообеспеченным домохозяйствам."}, {"id": "selective_support", "en": "Keep protection for strategic production and use targeted household support to offset higher living costs.", "he": "להשאיר הגנה על ייצור אסטרטגי ולפצות על יוקר המחיה באמצעות סיוע ממוקד למשקי בית.", "profile": {"imports": "selective", "consumer_tool": "support"}, "ru": "Сохранить защиту стратегического производства и компенсировать дороговизну адресной помощью домохозяйствам."}], "note": "Choose the policy package closest to your view. Each package has two separately scored components; choosing a package does not establish views beyond its wording.", "note_he": "בחרו את חבילת המדיניות הקרובה ביותר לעמדתכם. בכל חלופה שני מרכיבים שמושווים בנפרד; הבחירה אינה מעידה על עמדות מעבר למה שנכתב.", "ru": "Каким сочетанием мер снижать стоимость повседневных товаров?", "note_ru": "Выберите пакет политики, наиболее близкий к вашей позиции. Его два компонента сравниваются отдельно; выбор не означает согласия с положениями, которые здесь не указаны.", "help": {"overview": {"en": "Imports and competition can put pressure on prices; protection can support domestic production and supply resilience. Price controls and targeted aid address affordability differently. The trade-off depends on which sectors and households a policy covers.", "he": "יבוא ותחרות יכולים ללחוץ להורדת מחירים; הגנה יכולה לתמוך בייצור מקומי ובחוסן האספקה. פיקוח מחירים וסיוע ממוקד מטפלים ביכולת הקנייה בדרכים שונות. הפשרה תלויה בענפים ובמשקי הבית שהמדיניות מכסה.", "ru": "Импорт и конкуренция могут сдерживать цены, а защита — поддерживать местное производство и устойчивость поставок. Контроль цен и адресная помощь действуют по-разному. Компромисс зависит от охваченных отраслей и домохозяйств."}, "links": [{"url": "https://www.oecd.org/en/publications/oecd-economic-surveys-israel-2025_d6dd02bc-en/full-report/addressing-the-high-cost-of-living_bfe408a2.html", "title": {"en": "OECD: Addressing Israel's high cost of living", "he": "OECD: התמודדות עם יוקר המחיה בישראל", "ru": "ОЭСР: борьба с дороговизной в Израиле"}, "kind": "research", "language": "en"}, {"url": "https://zionutdatit.org.il/budget/", "title": {"en": "Religious Zionism: budget policies (2023–24)", "he": "הציונות הדתית: מדיניות תקציב (2023–24)", "ru": "Религиозный сионизм: бюджетная политика (2023–24)"}, "kind": "party", "language": "he"}], "discussion": {"en": ["How can lower import costs be passed on to shoppers rather than retained by concentrated retailers?", "When is protection needed for supply resilience, and when does it merely preserve an expensive incumbent?"], "he": ["כיצד מבטיחים שהוזלת היבוא תגיע לקונים ולא תישאר אצל קמעונאים ריכוזיים?", "מתי הגנה נדרשת לחוסן האספקה, ומתי היא רק משמרת ספק יקר?"], "ru": ["Как передать снижение импортных затрат покупателям, а не крупным торговым сетям?", "Когда защита нужна для устойчивости поставок, а когда лишь сохраняет дорогого действующего поставщика?"]}}}, {"id": "Q9", "short": true, "domain": "services", "en": "School curriculum: what common core should be compulsory, and in which schools?", "he": "תוכנית הלימודים: איזו ליבה משותפת צריכה להיות חובה, ובאילו בתי ספר?", "dimensions": [{"id": "core_condition", "en": "Scope of the common-core requirement", "he": "היקף החובה ללימודי ליבה", "weight": 1, "values": [{"id": "yes", "en": "Required for public funding", "he": "חובה כתנאי למימון ציבורי", "ru": "Условие бюджетного финансирования"}, {"id": "no", "en": "Not a condition of public funding", "he": "אינו תנאי למימון ציבורי", "ru": "Не является условием бюджетного финансирования"}, {"id": "universal", "en": "Required in every school, regardless of funding", "he": "חובה בכל בית ספר, ללא תלות במימון", "ru": "Обязательно во всех школах независимо от финансирования"}], "ru": "На какие школы распространяется обязательное общее ядро", "similarity": {"matrix": {"yes": {"yes": 1, "no": 0, "universal": 0.75}, "no": {"yes": 0, "no": 1, "universal": 0}, "universal": {"yes": 0.75, "no": 0, "universal": 1}}, "rationale": {"en": "A universal requirement and a funding condition both require core studies in publicly funded schools, but differ on schools without public funding; their similarity is estimated at 0.75. Support for a funding condition alone does not establish support for a universal mandate. Neither requirement overlaps with leaving public funding unconditional on core studies. Governance is scored separately.", "he": "חובה כללית ותנאי למימון מחייבים שניהם לימודי ליבה בבתי ספר המקבלים מימון ציבורי, אך שונים ביחס לבתי ספר שאינם מקבלים אותו; הדמיון מוערך ב־0.75. תמיכה בתנאי למימון לבדה אינה מעידה על תמיכה בחובה כללית. שתי הדרישות מנוגדות למימון ללא תנאי ליבה. מודל הניהול נבחן בנפרד.", "ru": "Всеобщая обязанность и условие финансирования требуют общего ядра в бюджетно финансируемых школах, но различаются в отношении школ без бюджетной поддержки; сходство оценено в 0,75. Поддержка условия финансирования сама по себе не доказывает поддержку всеобщей обязанности. Оба требования противоположны финансированию без условия общего ядра. Модель управления сравнивается отдельно."}}}, {"id": "school_model", "en": "School funding and governance", "he": "מודל המימון והניהול", "weight": 1, "values": [{"id": "state", "en": "Publicly funded state streams only", "he": "מימון ציבורי לזרמים ממלכתיים בלבד", "ru": "Финансирование только государственных направлений"}, {"id": "mixed", "en": "State and independent schools", "he": "בתי ספר ממלכתיים ועצמאיים", "ru": "Государственные и независимые школы"}, {"id": "voucher", "en": "Parent-directed vouchers", "he": "שוברים לבחירת ההורים", "ru": "Ваучеры по выбору родителей"}], "ru": "Модель финансирования и управления школами", "similarity": {"matrix": {"state": {"state": 1, "mixed": 0.5, "voucher": 0.25}, "mixed": {"state": 0.5, "mixed": 1, "voucher": 0.5}, "voucher": {"state": 0.25, "mixed": 0.5, "voucher": 1}}, "rationale": {"en": "Mixed provision shares public institutions with a state model and plural providers with vouchers.", "he": "מודל מעורב חולק מוסדות ציבוריים עם המודל הממלכתי וריבוי ספקים עם שוברים.", "ru": "Смешанная модель разделяет государственные учреждения с государственной моделью и разнообразие поставщиков с ваучерной."}}}], "options": [{"id": "state_core", "en": "Fund state education streams with a common core curriculum, while allowing cultural and religious content alongside it.", "he": "לממן זרמי חינוך ממלכתיים עם ליבה משותפת, לצד תכנים תרבותיים ודתיים.", "profile": {"core_condition": "yes", "school_model": "state"}, "ru": "Финансировать государственные образовательные направления с общей базовой программой, допуская дополнительные культурные и религиозные предметы."}, {"id": "mixed_core", "en": "Fund both state and independent schools, but make core studies a condition of public funding.", "he": "לממן בתי ספר ממלכתיים ועצמאיים, אך להתנות מימון ציבורי בלימודי ליבה.", "profile": {"core_condition": "yes", "school_model": "mixed"}, "ru": "Финансировать государственные и независимые школы, но требовать базовую программу как условие бюджетной поддержки."}, {"id": "autonomous", "en": "Fund state and independent religious or community schools without making the common core a funding condition.", "he": "לממן בתי ספר ממלכתיים וקהילתיים או דתיים עצמאיים, בלי להתנות את המימון בליבה משותפת.", "profile": {"core_condition": "no", "school_model": "mixed"}, "ru": "Финансировать государственные и независимые религиозные или общинные школы без обязательной общей базовой программы как условия поддержки."}, {"id": "voucher_autonomy", "en": "Let parents direct funding through vouchers, without a common-core condition imposed by the state.", "he": "לאפשר להורים לכוון את המימון בשוברים, בלי שהמדינה תתנה אותו בליבה משותפת.", "profile": {"core_condition": "no", "school_model": "voucher"}, "ru": "Позволить родителям направлять финансирование через ваучеры без установленного государством условия общей базовой программы."}, {"id": "universal_core", "en": "Require every school (state, private and religious) to teach a common core, regardless of funding. Allow additional subjects and public funding for both state and independent schools.", "he": "לחייב כל בית ספר (ממלכתי, פרטי ודתי) ללמד ליבה משותפת, ללא תלות במקור המימון. לאפשר מקצועות נוספים ומימון ציבורי לבתי ספר ממלכתיים ועצמאיים.", "profile": {"core_condition": "universal", "school_model": "mixed"}, "ru": "Обязать все школы преподавать общее ядро программы (core), включая государственные, частные и религиозные школы, независимо от финансирования. Разрешить дополнительные предметы и бюджетную поддержку государственных и независимых школ."}], "note": "Choose the policy package closest to your view. Each package has two separately scored components; choosing a package does not establish views beyond its wording.", "note_he": "בחרו את חבילת המדיניות הקרובה ביותר לעמדתכם. בכל חלופה שני מרכיבים שמושווים בנפרד; הבחירה אינה מעידה על עמדות מעבר למה שנכתב.", "ru": "Школьная программа: какое общее ядро должно быть обязательным и в каких школах?", "note_ru": "Выберите пакет политики, наиболее близкий к вашей позиции. Его два компонента сравниваются отдельно; выбор не означает согласия с положениями, которые здесь не указаны.", "help": {"overview": {"en": "A common core curriculum sets shared knowledge and skills, such as mathematics and languages, while leaving room for cultural and religious subjects. It can be required in every school regardless of funding, or only as a condition of public support; another approach leaves public funding unconditional on core studies. Who defines this core, who runs schools and how they are funded are separate choices.", "he": "תוכנית ליבה משותפת קובעת ידע ומיומנויות משותפים, כגון מתמטיקה ושפות, לצד מקום לתכנים תרבותיים ודתיים. אפשר לחייב אותה בכל בית ספר ללא תלות במימון, או רק כתנאי לתמיכה ציבורית; גישה אחרת אינה מתנה מימון בלימודי ליבה. מי מגדיר את הליבה, מי מנהל את בתי הספר וכיצד מממנים אותם הן בחירות נפרדות.", "ru": "Общее ядро программы задаёт общие знания и навыки, например по математике и языкам, оставляя место культурным и религиозным предметам. Его можно сделать обязательным во всех школах независимо от финансирования или только условием бюджетной поддержки; ещё один подход — не связывать финансирование с общим ядром. Кто определяет ядро, кто управляет школами и как их финансировать — отдельные вопросы."}, "links": [{"url": "https://www.oecd.org/en/publications/oecd-economic-surveys-israel-2025_d6dd02bc-en.html", "title": {"en": "OECD: Israel 2025 — education, skills and the economy", "he": "OECD: ישראל 2025 — חינוך, מיומנויות וכלכלה", "ru": "ОЭСР: Израиль 2025 — образование, навыки и экономика"}, "kind": "research", "language": "en"}, {"url": "https://zehut.org.il/platform/full", "title": {"en": "Zehut: published program", "he": "זהות: המצע המפורסם", "ru": "Зеут: опубликованная программа"}, "kind": "party", "language": "he"}], "discussion": {"en": ["Who defines the common core, and how much room remains for cultural or religious difference?", "If funding is withdrawn, how can children be protected from the consequences of an institution's decision?", "Should the common core also be mandatory in schools that receive no public funding, and how should that requirement be enforced?"], "he": ["מי מגדיר את הליבה המשותפת, וכמה מקום נותר לשונות תרבותית או דתית?", "אם המימון נשלל, כיצד מגינים על ילדים מפני השלכות החלטת המוסד?", "האם הליבה צריכה להיות חובה גם בבתי ספר שאינם מקבלים מימון ציבורי, וכיצד יש לאכוף זאת?"], "ru": ["Кто определяет базовую программу и сколько места остаётся культурным и религиозным различиям?", "Как защитить детей от последствий решения учреждения, если его финансирование отзывают?", "Должно ли общее ядро быть обязательным и в школах без бюджетной поддержки, и как обеспечивать выполнение этого требования?"]}}}, {"id": "Q10", "short": true, "domain": "services", "en": "How should serious organized crime and protection rackets be tackled?", "he": "כיצד יש להתמודד עם פשיעה מאורגנת חמורה וגביית דמי חסות?", "dimensions": [{"id": "security_role", "en": "Shin Bet role beyond terrorism", "he": "תפקיד לשב״כ גם מעבר לטרור", "weight": 1, "values": [{"id": "yes", "en": "Yes", "he": "כן", "ru": "Да"}, {"id": "no", "en": "No", "he": "לא", "ru": "Нет"}], "ru": "Роль ШАБАКа за пределами борьбы с терроризмом", "similarity": {"matrix": {"yes": {"yes": 1, "no": 0}, "no": {"yes": 0, "no": 1}}, "rationale": {"en": "These are opposed answers to this explicit policy commitment; shared aspects are scored in the other component.", "he": "אלה תשובות מנוגדות להתחייבות המדיניות המפורשת; היבטים משותפים נבחנים במרכיב האחר.", "ru": "Это противоположные ответы на конкретный вопрос политики; общие аспекты учитываются другим компонентом."}}}, {"id": "lead", "en": "Institutional lead", "he": "הגוף המוביל", "weight": 1, "values": [{"id": "national_police", "en": "National police and prosecution", "he": "משטרה ארצית ופרקליטות", "ru": "Общенациональная полиция и прокуратура"}, {"id": "local_police", "en": "Locally accountable policing", "he": "שיטור באחריות מקומית", "ru": "Полиция, подотчётная местному сообществу"}, {"id": "security", "en": "Security-service leadership", "he": "הובלה של שירותי הביטחון", "ru": "Руководство спецслужб"}], "ru": "Ведущее ведомство", "similarity": {"matrix": {"national_police": {"national_police": 1, "local_police": 0.75, "security": 0.25}, "local_police": {"national_police": 0.75, "local_police": 1, "security": 0}, "security": {"national_police": 0.25, "local_police": 0, "security": 1}}, "rationale": {"en": "National and local police remain civilian policing; security-service leadership is a different institutional mandate.", "he": "משטרה ארצית ומקומית הן שיטור אזרחי; הובלת שירותי ביטחון היא מנדט מוסדי שונה.", "ru": "Национальная и местная полиция остаются гражданской полицией; руководство спецслужб означает иной мандат."}}}], "options": [{"id": "police_only", "en": "Strengthen police investigations, financial enforcement and prosecution; keep the Shin Bet focused on security threats.", "he": "לחזק חקירות משטרה, אכיפה כלכלית ופרקליטות; להשאיר את השב״כ ממוקד באיומים ביטחוניים.", "profile": {"security_role": "no", "lead": "national_police"}, "ru": "Укреплять полицейское следствие, финансовый контроль и прокуратуру, оставив ШАБАКу угрозы безопасности."}, {"id": "police_assisted", "en": "Keep the police in charge, with a legally defined Shin Bet intelligence role in serious organized crime and judicial oversight.", "he": "להשאיר את ההובלה במשטרה, עם תפקיד מודיעיני מוגדר בחוק לשב״כ בפשיעה מאורגנת חמורה ובפיקוח שיפוטי.", "profile": {"security_role": "yes", "lead": "national_police"}, "ru": "Оставить руководство полиции, предусмотрев законом разведывательную роль ШАБАКа в тяжёлой организованной преступности под судебным надзором."}, {"id": "security_led", "en": "Give security services the lead against serious protection rackets, including cases not already linked to terrorism.", "he": "להעניק לשירותי הביטחון הובלה במאבק בגביית דמי חסות חמורה, גם במקרים שטרם נקשרו לטרור.", "profile": {"security_role": "yes", "lead": "security"}, "ru": "Передать спецслужбам ведущую роль в борьбе с тяжёлым вымогательством, включая случаи, ещё не связанные с терроризмом."}, {"id": "local_policing", "en": "Build locally accountable policing and prevention services, supported by national investigators, without a Shin Bet role.", "he": "לבנות שיטור ושירותי מניעה באחריות מקומית ובסיוע חוקרים ארציים, ללא תפקיד לשב״כ.", "profile": {"security_role": "no", "lead": "local_police"}, "ru": "Развивать подотчётную местному сообществу полицию и профилактику с поддержкой общенациональных следователей, без участия ШАБАКа."}], "note": "Choose the policy package closest to your view. Each package has two separately scored components; choosing a package does not establish views beyond its wording.", "note_he": "בחרו את חבילת המדיניות הקרובה ביותר לעמדתכם. בכל חלופה שני מרכיבים שמושווים בנפרד; הבחירה אינה מעידה על עמדות מעבר למה שנכתב.", "ru": "Как бороться с тяжёлой организованной преступностью и вымогательством?", "note_ru": "Выберите пакет политики, наиболее близкий к вашей позиции. Его два компонента сравниваются отдельно; выбор не означает согласия с положениями, которые здесь не указаны.", "help": {"overview": {"en": "Police and security services have different purposes and powers. The debate weighs stronger intelligence against limits on surveillance and accountability. It also asks whether national bodies or locally accountable institutions should lead prevention and enforcement.", "he": "למשטרה ולשירותי הביטחון מטרות וסמכויות שונות. הדיון מאזן בין יכולות מודיעין חזקות יותר לבין מגבלות מעקב ופיקוח. הוא עוסק גם בשאלה אם גופים ארציים או מוסדות באחריות מקומית יובילו מניעה ואכיפה.", "ru": "У полиции и спецслужб разные задачи и полномочия. Спор сопоставляет разведывательные возможности с ограничением слежки и подотчётностью. Он также касается национального или местного руководства профилактикой и правоприменением."}, "links": [{"url": "https://en.idi.org.il/articles/65195", "title": {"en": "IDI: Shin Bet involvement in serious crime", "he": "IDI: מעורבות השב״כ בפשיעה חמורה", "ru": "IDI: участие ШАБАКа в борьбе с тяжёлой преступностью"}, "kind": "analysis", "language": "en"}, {"url": "https://be-yahad.org.il/plans/?bennett_plans_cat=198", "title": {"en": "Beyahad: published policy plans", "he": "ביחד: תוכניות המדיניות", "ru": "Беяхад: опубликованные планы"}, "kind": "party", "language": "he"}], "discussion": {"en": ["What limits would prevent exceptional intelligence powers from becoming routine policing tools?", "What evidence would show that the chosen intervention reduces violence without undermining public trust?"], "he": ["אילו מגבלות ימנעו מסמכויות מודיעין חריגות להפוך לכלי שיטור שגרתי?", "איזה מידע יראה שההתערבות מפחיתה אלימות בלי לפגוע באמון הציבור?"], "ru": ["Что помешает превращению исключительных разведывательных полномочий в обычный полицейский инструмент?", "Какие данные покажут снижение насилия без подрыва общественного доверия?"]}}}, {"id": "Q11", "short": false, "domain": "security", "en": "What territorial policy should Israel pursue in the West Bank / Judea and Samaria?", "he": "איזו מדיניות טריטוריאלית על ישראל לקדם ביהודה ושומרון / הגדה המערבית?", "dimensions": [{"id": "unilateral_sovereignty", "en": "Unilateral extension of sovereignty", "he": "החלת ריבונות חד־צדדית", "weight": 1, "values": [{"id": "yes", "en": "Yes", "he": "כן", "ru": "Да"}, {"id": "no", "en": "No", "he": "לא", "ru": "Нет"}], "ru": "Одностороннее распространение суверенитета", "similarity": {"matrix": {"yes": {"yes": 1, "no": 0}, "no": {"yes": 0, "no": 1}}, "rationale": {"en": "These are opposed answers to this explicit policy commitment; shared aspects are scored in the other component.", "he": "אלה תשובות מנוגדות להתחייבות המדיניות המפורשת; היבטים משותפים נבחנים במרכיב האחר.", "ru": "Это противоположные ответы на конкретный вопрос политики; общие аспекты учитываются другим компонентом."}}}, {"id": "territorial_route", "en": "Territorial approach", "he": "המסלול הטריטוריאלי", "weight": 1, "values": [{"id": "partial", "en": "Annex selected areas", "he": "סיפוח אזורים נבחרים", "ru": "Аннексия отдельных районов"}, {"id": "all", "en": "Annex the whole territory", "he": "סיפוח השטח כולו", "ru": "Аннексия всей территории"}, {"id": "agreement", "en": "Negotiated borders", "he": "גבולות במשא ומתן", "ru": "Границы по соглашению"}, {"id": "freeze", "en": "No final border change for now", "he": "ללא שינוי גבול קבוע כעת", "ru": "Без окончательного изменения границ сейчас"}, {"id": "withdraw", "en": "Unilateral withdrawal", "he": "נסיגה חד־צדדית", "ru": "Односторонний вывод"}], "ru": "Территориальный подход", "similarity": {"matrix": {"partial": {"partial": 1, "all": 0.75, "agreement": 0, "freeze": 0.25, "withdraw": 0}, "all": {"partial": 0.75, "all": 1, "agreement": 0, "freeze": 0, "withdraw": 0}, "agreement": {"partial": 0, "all": 0, "agreement": 1, "freeze": 0.5, "withdraw": 0.5}, "freeze": {"partial": 0.25, "all": 0, "agreement": 0.5, "freeze": 1, "withdraw": 0.25}, "withdraw": {"partial": 0, "all": 0, "agreement": 0.5, "freeze": 0.25, "withdraw": 1}}, "rationale": {"en": "Partial and full annexation share the sovereignty instrument; agreement and withdrawal may share separation but differ on consent and process.", "he": "סיפוח חלקי ומלא חולקים החלת ריבונות; הסכם ונסיגה עשויים לחלוק הפרדה אך נבדלים בהסכמה ובתהליך.", "ru": "Частичная и полная аннексия используют суверенитет; соглашение и вывод могут разделять идею размежевания, но отличаются процессом и согласием."}}}], "options": [{"id": "partial", "en": "Extend sovereignty unilaterally to selected areas, while leaving other areas outside Israeli sovereignty.", "he": "להחיל ריבונות באופן חד־צדדי על אזורים נבחרים, ולהשאיר אזורים אחרים מחוץ לריבונות ישראל.", "profile": {"unilateral_sovereignty": "yes", "territorial_route": "partial"}, "ru": "Односторонне распространить суверенитет на отдельные районы, оставив остальные вне израильского суверенитета."}, {"id": "all", "en": "Extend Israeli sovereignty to the entire territory.", "he": "להחיל ריבונות ישראלית על השטח כולו.", "profile": {"unilateral_sovereignty": "yes", "territorial_route": "all"}, "ru": "Распространить израильский суверенитет на всю территорию."}, {"id": "agreement", "en": "Make territorial changes only through a negotiated agreement with agreed borders.", "he": "לבצע שינויים טריטוריאליים רק במסגרת הסכם וגבולות מוסכמים.", "profile": {"unilateral_sovereignty": "no", "territorial_route": "agreement"}, "ru": "Менять территориальный статус только через соглашение с согласованными границами."}, {"id": "freeze", "en": "Avoid annexation or withdrawal for now; maintain security control while deferring final borders.", "he": "להימנע כעת מסיפוח ומנסיגה, ולשמר שליטה ביטחונית תוך דחיית ההכרעה על גבולות הקבע.", "profile": {"unilateral_sovereignty": "no", "territorial_route": "freeze"}, "ru": "Пока отказаться и от аннексии, и от вывода, сохраняя контроль безопасности и отложив решение об окончательных границах."}, {"id": "withdraw", "en": "Withdraw unilaterally from selected areas and settlements to reduce permanent involvement, without waiting for an agreement.", "he": "לסגת באופן חד־צדדי מאזורים ומיישובים נבחרים כדי לצמצם מעורבות קבועה, בלי להמתין להסכם.", "profile": {"unilateral_sovereignty": "no", "territorial_route": "withdraw"}, "ru": "Односторонне уйти из отдельных районов и поселений, чтобы сократить постоянное присутствие, не дожидаясь соглашения."}], "note": "Choose the policy package closest to your view. Each package has two separately scored components; choosing a package does not establish views beyond its wording.", "note_he": "בחרו את חבילת המדיניות הקרובה ביותר לעמדתכם. בכל חלופה שני מרכיבים שמושווים בנפרד; הבחירה אינה מעידה על עמדות מעבר למה שנכתב.", "ru": "Какую территориальную политику проводить на Западном берегу / в Иудее и Самарии?", "note_ru": "Выберите пакет политики, наиболее близкий к вашей позиции. Его два компонента сравниваются отдельно; выбор не означает согласия с положениями, которые здесь не указаны.", "help": {"overview": {"en": "Formal sovereignty, military control and settlement construction are different acts. Annexation, negotiated borders and withdrawal have different implications for security, residents' rights and future agreements. The amount of territory and the status of its residents matter.", "he": "ריבונות רשמית, שליטה צבאית ובניית יישובים הן פעולות שונות. לסיפוח, לגבולות מוסכמים ולנסיגה השלכות שונות על ביטחון, זכויות תושבים והסכמים עתידיים. היקף השטח ומעמד התושבים חשובים.", "ru": "Формальный суверенитет, военный контроль и строительство поселений — разные действия. Аннексия, согласованные границы и вывод по-разному влияют на безопасность, права жителей и будущие соглашения. Важны площадь территории и статус жителей."}, "links": [{"url": "https://en.idi.org.il/articles/31883", "title": {"en": "IDI: Application of sovereignty — explainer", "he": "IDI: הסבר על החלת ריבונות", "ru": "IDI: распространение суверенитета — разбор"}, "kind": "analysis", "language": "en"}, {"url": "https://zionutdatit.org.il/hityashvut/sovereignty/", "title": {"en": "Religious Zionism: sovereignty policy", "he": "הציונות הדתית: מדיניות הריבונות", "ru": "Религиозный сионизм: политика суверенитета"}, "kind": "party", "language": "he"}], "discussion": {"en": ["What legal status and political representation would residents of each affected area receive?", "Which steps preserve future options, and which create commitments that are hard to reverse?"], "he": ["איזה מעמד משפטי וייצוג פוליטי יקבלו תושבי כל אזור מושפע?", "אילו צעדים משמרים אפשרויות עתידיות, ואילו יוצרים מחויבויות שקשה להפוך?"], "ru": ["Какой правовой статус и политическое представительство получат жители затронутых районов?", "Какие шаги сохраняют будущие варианты, а какие создают труднообратимые обязательства?"]}}}, {"id": "Q12", "short": false, "domain": "security", "en": "What should the long-term arrangement in Gaza be?", "he": "מה צריך להיות ההסדר ארוך הטווח ברצועת עזה?", "dimensions": [{"id": "settlements", "en": "Israeli civilian settlements", "he": "יישובים אזרחיים ישראליים", "weight": 1, "values": [{"id": "yes", "en": "Yes", "he": "כן", "ru": "Да"}, {"id": "no", "en": "No", "he": "לא", "ru": "Нет"}], "ru": "Израильские гражданские поселения", "similarity": {"matrix": {"yes": {"yes": 1, "no": 0}, "no": {"yes": 0, "no": 1}}, "rationale": {"en": "These are opposed answers to this explicit policy commitment; shared aspects are scored in the other component.", "he": "אלה תשובות מנוגדות להתחייבות המדיניות המפורשת; היבטים משותפים נבחנים במרכיב האחר.", "ru": "Это противоположные ответы на конкретный вопрос политики; общие аспекты учитываются другим компонентом."}}}, {"id": "administration", "en": "Civil administration", "he": "המנהל האזרחי", "weight": 1, "values": [{"id": "israeli", "en": "Israeli administration", "he": "מנהל ישראלי", "ru": "Израильская администрация"}, {"id": "palestinian", "en": "Palestinian administration", "he": "מנהל פלסטיני", "ru": "Палестинская администрация"}, {"id": "international", "en": "International or regional administration", "he": "מנהל בינלאומי או אזורי", "ru": "Международная или региональная администрация"}], "ru": "Гражданская администрация", "similarity": {"matrix": {"israeli": {"israeli": 1, "palestinian": 0, "international": 0.25}, "palestinian": {"israeli": 0, "palestinian": 1, "international": 0.5}, "international": {"israeli": 0.25, "palestinian": 0.5, "international": 1}}, "rationale": {"en": "International administration has some overlap with non-Israeli governance and limited overlap with externally administered reconstruction.", "he": "למנהל בינלאומי חפיפה מסוימת עם שלטון שאינו ישראלי וחפיפה מוגבלת עם ניהול שיקום חיצוני.", "ru": "Международная администрация частично сходна с неизраильским управлением и в меньшей степени — с внешним управлением восстановлением."}}}], "options": [{"id": "israeli_settlements", "en": "Establish Israeli civilian settlements and long-term Israeli civil administration.", "he": "להקים יישובים אזרחיים ישראליים ומנהל אזרחי ישראלי ארוך טווח.", "profile": {"settlements": "yes", "administration": "israeli"}, "ru": "Создать израильские гражданские поселения и долгосрочную израильскую гражданскую администрацию."}, {"id": "israeli_no_settlements", "en": "Maintain long-term Israeli administration for security and reconstruction, without civilian settlements.", "he": "לקיים מנהל ישראלי ארוך טווח לצורכי ביטחון ושיקום, ללא יישובים אזרחיים.", "profile": {"settlements": "no", "administration": "israeli"}, "ru": "Сохранить долгосрочную израильскую администрацию для безопасности и восстановления, без гражданских поселений."}, {"id": "palestinian", "en": "Establish Palestinian civil administration with enforceable security arrangements and no Israeli civilian settlements.", "he": "להקים מנהל אזרחי פלסטיני עם הסדרי ביטחון ניתנים לאכיפה וללא יישובים אזרחיים ישראליים.", "profile": {"settlements": "no", "administration": "palestinian"}, "ru": "Создать палестинскую гражданскую администрацию с проверяемыми механизмами безопасности и без израильских гражданских поселений."}, {"id": "international", "en": "Seek an international or regional administration for reconstruction and governance, without Israeli civilian settlements.", "he": "לפעול למנהל בינלאומי או אזורי לשיקום ולניהול אזרחי, ללא יישובים אזרחיים ישראליים.", "profile": {"settlements": "no", "administration": "international"}, "ru": "Добиваться международной или региональной администрации для восстановления и управления, без израильских гражданских поселений."}], "note": "Choose the policy package closest to your view. Each package has two separately scored components; choosing a package does not establish views beyond its wording.", "note_he": "בחרו את חבילת המדיניות הקרובה ביותר לעמדתכם. בכל חלופה שני מרכיבים שמושווים בנפרד; הבחירה אינה מעידה על עמדות מעבר למה שנכתב.", "ru": "Каким должно быть долгосрочное устройство сектора Газа?", "note_ru": "Выберите пакет политики, наиболее близкий к вашей позиции. Его два компонента сравниваются отдельно; выбор не означает согласия с положениями, которые здесь не указаны.", "help": {"overview": {"en": "Civil administration manages everyday life and reconstruction; it is not the same as military operations. Gaza proposals differ over who governs and whether Israeli civilian settlements return. Security arrangements and governing legitimacy are central to the disagreement.", "he": "מנהל אזרחי עוסק בחיי היום־יום ובשיקום ואינו זהה לפעילות צבאית. ההצעות לעזה שונות בזהות הגוף השולט ובשאלת חידוש ההתיישבות האזרחית הישראלית. הסדרי הביטחון ולגיטימיות השלטון עומדים במרכז המחלוקת.", "ru": "Гражданская администрация управляет повседневной жизнью и восстановлением, а не тождественна военным операциям. Предложения по Газе различаются властью и возвращением израильских поселений. Центральны безопасность и легитимность управления."}, "links": [{"url": "https://www.inss.org.il/publication/the-day-after/", "title": {"en": "INSS: Regional proposals for post-war Gaza", "he": "INSS: מתווים אזוריים לעזה לאחר המלחמה", "ru": "INSS: региональные варианты послевоенного устройства Газы"}, "kind": "analysis", "language": "en"}, {"url": "https://zehut.org.il/platform/full", "title": {"en": "Zehut: published program", "he": "זהות: המצע המפורסם", "ru": "Зеут: опубликованная программа"}, "kind": "party", "language": "he"}], "discussion": {"en": ["Who would be willing and able to govern, and why would residents accept that authority?", "How would security, reconstruction funding and responsibility for civilians be divided?"], "he": ["מי יסכים ויוכל למשול, ומדוע התושבים יקבלו את סמכותו?", "כיצד יחולקו האחריות לביטחון, מימון השיקום והאחריות לאזרחים?"], "ru": ["Кто захочет и сможет управлять и почему жители признают эту власть?", "Как распределить безопасность, финансирование восстановления и ответственность за гражданских?"]}}}, {"id": "Q13", "short": false, "domain": "institutions", "en": "What kind of inquiry should investigate the October 7 failures?", "he": "איזה סוג של חקירה צריך לבדוק את מחדלי 7 באוקטובר?", "dimensions": [{"id": "statutory", "en": "Independent statutory commission", "he": "ועדה עצמאית מכוח חוק", "weight": 1, "values": [{"id": "yes", "en": "Yes", "he": "כן", "ru": "Да"}, {"id": "no", "en": "No", "he": "לא", "ru": "Нет"}], "ru": "Независимая комиссия на основании закона", "similarity": {"matrix": {"yes": {"yes": 1, "no": 0}, "no": {"yes": 0, "no": 1}}, "rationale": {"en": "These are opposed answers to this explicit policy commitment; shared aspects are scored in the other component.", "he": "אלה תשובות מנוגדות להתחייבות המדיניות המפורשת; היבטים משותפים נבחנים במרכיב האחר.", "ru": "Это противоположные ответы на конкретный вопрос политики; общие аспекты учитываются другим компонентом."}}}, {"id": "appointment", "en": "Who appoints the members?", "he": "מי ממנה את החברים?", "weight": 1, "values": [{"id": "judicial", "en": "President of the Supreme Court", "he": "נשיא בית המשפט העליון", "ru": "Председатель Верховного суда"}, {"id": "consensus", "en": "Government–opposition agreement", "he": "הסכמה בין קואליציה לאופוזיציה", "ru": "По соглашению коалиции и оппозиции"}, {"id": "government", "en": "Government", "he": "הממשלה", "ru": "Правительство"}, {"id": "public", "en": "Public and professional bodies", "he": "גופים ציבוריים ומקצועיים", "ru": "Общественные и профессиональные организации"}], "ru": "Кто назначает членов?", "similarity": {"matrix": {"judicial": {"judicial": 1, "consensus": 0.75, "government": 0, "public": 0.5}, "consensus": {"judicial": 0.75, "consensus": 1, "government": 0.25, "public": 0.5}, "government": {"judicial": 0, "consensus": 0.25, "government": 1, "public": 0}, "public": {"judicial": 0.5, "consensus": 0.5, "government": 0, "public": 1}}, "rationale": {"en": "Judicial and cross-party appointment share separation from unilateral government control; public review differs in mandate.", "he": "מינוי שיפוטי ובהסכמה רחבה חולקים הפרדה משליטה ממשלתית חד־צדדית; בדיקה ציבורית שונה במנדט.", "ru": "Судебное и межпартийное назначение отделены от одностороннего контроля правительства; общественная проверка отличается мандатом."}}}], "options": [{"id": "state_commission", "en": "Use a state commission of inquiry whose members are appointed by the president of the Supreme Court.", "he": "להקים ועדת חקירה ממלכתית שחבריה מתמנים בידי נשיא בית המשפט העליון.", "profile": {"statutory": "yes", "appointment": "judicial"}, "ru": "Создать государственную следственную комиссию, членов которой назначает председатель Верховного суда."}, {"id": "consensus_commission", "en": "Create a statutory independent commission under a new appointment arrangement agreed by government and opposition.", "he": "להקים ועדה עצמאית מכוח חוק, לפי הסדר מינוי חדש שיוסכם בין קואליציה לאופוזיציה.", "profile": {"statutory": "yes", "appointment": "consensus"}, "ru": "Создать независимую комиссию на основании закона с новым порядком назначения, согласованным коалицией и оппозицией."}, {"id": "government_inquiry", "en": "Use a government-appointed inquiry with professional investigators and a publicly defined mandate.", "he": "לקיים בדיקה במינוי הממשלה, עם חוקרים מקצועיים ומנדט שיפורסם לציבור.", "profile": {"statutory": "no", "appointment": "government"}, "ru": "Провести проверку назначенной правительством комиссией с профессиональными следователями и публично определёнными полномочиями."}, {"id": "public_review", "en": "Rely on an independent public and professional review, rather than a state commission.", "he": "להסתמך על בדיקה ציבורית ומקצועית עצמאית, במקום ועדת חקירה ממלכתית.", "profile": {"statutory": "no", "appointment": "public"}, "ru": "Провести независимую общественную и профессиональную проверку вместо государственной следственной комиссии."}], "note": "Choose the policy package closest to your view. Each package has two separately scored components; choosing a package does not establish views beyond its wording.", "note_he": "בחרו את חבילת המדיניות הקרובה ביותר לעמדתכם. בכל חלופה שני מרכיבים שמושווים בנפרד; הבחירה אינה מעידה על עמדות מעבר למה שנכתב.", "ru": "Как расследовать провалы, связанные с 7 октября?", "note_ru": "Выберите пакет политики, наиболее близкий к вашей позиции. Его два компонента сравниваются отдельно; выбор не означает согласия с положениями, которые здесь не указаны.", "help": {"overview": {"en": "An inquiry's credibility depends on who appoints it, its independence and its powers to obtain evidence. The debate concerns how to investigate decision-makers without letting those being investigated control the process, while securing broad public trust.", "he": "אמינות החקירה תלויה במינוי החברים, בעצמאות ובסמכויות להשגת ראיות. המחלוקת היא כיצד לחקור מקבלי החלטות בלי שהנחקרים ישלטו בתהליך, ובו בזמן לזכות באמון ציבורי רחב.", "ru": "Доверие к расследованию зависит от назначения членов, независимости и доступа к доказательствам. Спор — как расследовать действия руководителей, не отдавая им контроль над проверкой, и добиться широкого общественного доверия."}, "links": [{"url": "https://en.idi.org.il/articles/32929", "title": {"en": "IDI: What is a commission of inquiry?", "he": "IDI: מהי ועדת חקירה?", "ru": "IDI: что такое следственная комиссия?"}, "kind": "analysis", "language": "en"}, {"url": "https://be-yahad.org.il/plans/?bennett_plans_cat=198", "title": {"en": "Beyahad: published policy plans", "he": "ביחד: תוכניות המדיניות", "ru": "Беяхад: опубликованные планы"}, "kind": "party", "language": "he"}], "discussion": {"en": ["How can a commission compel evidence while safeguarding due process and sensitive information?", "What appointment method earns trust when both the government and its critics dispute the institutions?"], "he": ["כיצד ועדה תשיג ראיות מחייבות תוך הגנה על הליך הוגן ועל מידע רגיש?", "איזו שיטת מינוי תזכה לאמון כשהממשלה ומבקריה חולקים על המוסדות?"], "ru": ["Как комиссия получит доказательства, сохраняя надлежащую процедуру и защиту чувствительной информации?", "Какое назначение вызывает доверие, если институты оспаривают и правительство, и его критики?"]}}}, {"id": "Q14", "short": false, "domain": "institutions", "en": "How should the prime minister's tenure and accountability be regulated?", "he": "כיצד יש להסדיר את משך כהונת ראש הממשלה ואת האחריות כלפי הציבור?", "dimensions": [{"id": "binding_limit", "en": "Binding tenure limit", "he": "הגבלת כהונה מחייבת", "weight": 1, "values": [{"id": "yes", "en": "Yes", "he": "כן", "ru": "Да"}, {"id": "no", "en": "No", "he": "לא", "ru": "Нет"}], "ru": "Обязательное ограничение пребывания у власти", "similarity": {"matrix": {"yes": {"yes": 1, "no": 0}, "no": {"yes": 0, "no": 1}}, "rationale": {"en": "These are opposed answers to this explicit policy commitment; shared aspects are scored in the other component.", "he": "אלה תשובות מנוגדות להתחייבות המדיניות המפורשת; היבטים משותפים נבחנים במרכיב האחר.", "ru": "Это противоположные ответы на конкретный вопрос политики; общие аспекты учитываются другим компонентом."}}}, {"id": "mechanism", "en": "Accountability mechanism", "he": "מנגנון האחריות", "weight": 1, "values": [{"id": "terms", "en": "Two-term
